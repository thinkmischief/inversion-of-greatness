      var text = (num && title) ? num.textContent + ' ' + title.textContent : getChapterCrumb();
      sectionIndicator.textContent = text;
      if (runningHeadEl) runningHeadEl.textContent = text;
    };

    updateCurrentSection();
    var sectionTicking = false;
    window.addEventListener('scroll', function () {
      if (sectionTicking) return;
      sectionTicking = true;
      window.requestAnimationFrame(function () {
        updateCurrentSection();
        sectionTicking = false;
      });
    }, { passive: true });
  }

  // ── Box header: Label · handle · Tag ──────────────────────────────
  // Applies to every semantic block (definition/identification/
  // principle/theorem/lemma/premise/corollary/condition/argument).
  // custom.css no longer generates this via ::before — a single
  // pseudo-element can't hold several independently-styled strings
  // on one line — so this inserts a real .box-header element as
  // each box's first child: a .box-header-title span (the box's own
  // name), then — only for types with a numbered claim-cite-key or
  // a Condition letter — a bold .box-header-handle (T1/L7/P3, or a
  // bare T/S/Φ for Condition), then always a spelled-out italic
  // .box-header-tag (Theorem 1, Premise 3, Definition, Result,
  // Condition, Move…), each pair separated by a
  // .box-header-dot interpunct. The tag always renders, even for a
  // box whose bold lead-in has no parenthetical at all — that's the
  // type name alone. Name comes from the box's own bold lead-in
  // where it has one (e.g. "Necessary Possibility of Change" for a
  // lemma) — the first <strong> in the box, but only counted if
  // it's the very start of the box's first paragraph, not some
  // later bolded phrase. Where there isn't one (e.g. Plantinga's
  // ontological argument, an unlabeled derivation), falls back to
  // the title of whichever section the box actually sits in.
  (function () {
    // Condition is special-cased below (three colors, one per
    // letter) — every other type's handle/tag comes from this table.
    // handleRegex captures the bare number; tag(m) builds the
    // spelled-out tag from that match (or null, if the label didn't
    // match — e.g. a Premise box with no P# at all).
    var TYPE_RULES = {
      theorem: {
        handleRegex: /^T(\d+)$/,
        handle: function (m) { return 'T' + m[1]; },
        tag: function (m) { return m ? 'Theorem ' + m[1] : 'Theorem'; }
      },
      lemma: {
        handleRegex: /^L(\d+)$/,
        handle: function (m) { return 'L' + m[1]; },
        tag: function (m) { return m ? 'Lemma ' + m[1] : 'Lemma'; }
      },
      premise: {
        handleRegex: /^P(\d+)$/,
        handle: function (m) { return 'P' + m[1]; },
        tag: function (m) { return m ? 'Premise ' + m[1] : 'Premise'; }
      },
      // Result never gets a handle — either bare "Result" or a
      // fuller "Result of T3" / "Result of Theorems 5 and 7" label,
      // which (already spelled out at the source) passes straight
      // through as the tag.
      corollary: {
        tag: function (rawLabel) {
          if (!rawLabel) return 'Result';
          if (/^result\b/i.test(rawLabel)) {
            return 'Result' + rawLabel.replace(/^result/i, '');
          }
          return 'Result';
        }
      },
      // Definition/Identification/Principle carry no NUMBERED
      // handle, but a term some of these define is given its own
      // short symbol elsewhere in the book (e.g. "Change" -> C),
      // and that symbol still earns the three-beat header — see
      // bareSymbolOk handling in the caller below.
      definition:     { tag: function () { return 'Definition'; }, bareSymbolOk: true },
      identification: { tag: function () { return 'Identification'; }, bareSymbolOk: true },
      principle:      { tag: function () { return 'Principle'; }, bareSymbolOk: true },
      // Move never shows the word "Move" itself (name-forward
      // exception, see the echo/subtitle handling above) — with no
      // gloss available at all, it shows only its name, no tag.
      // (Argument, the type sharing this same class/icon, bypasses
      // this table entirely via argNameText — see above.)
      argument:       { tag: function () { return null; } }
    };
    var TAG_FALLBACK = {
      definition: 'Definition', identification: 'Identification', principle: 'Principle',
      theorem: 'Theorem', lemma: 'Lemma', premise: 'Premise', corollary: 'Result',
      condition: 'Condition', argument: 'Move', untyped: null
    };
    var CONDITION_LETTERS = {
      T: { mod: 'condition-time' },
      S: { mod: 'condition-space' },
      'Φ': { mod: 'condition-substance' }
    };

    var boxes = document.querySelectorAll(
      'main.content .definition, main.content .identification, main.content .principle, ' +
      'main.content .theorem, main.content .lemma, main.content .premise, ' +
      'main.content .corollary, main.content .condition, main.content .argument, ' +
      'main.content .untyped, ' +
      '#quarto-document-content .definition, #quarto-document-content .identification, ' +
      '#quarto-document-content .principle, #quarto-document-content .theorem, ' +
      '#quarto-document-content .lemma, #quarto-document-content .premise, ' +
      '#quarto-document-content .corollary, #quarto-document-content .condition, ' +
      '#quarto-document-content .argument, #quarto-document-content .untyped'
    );
    for (var i = 0; i < boxes.length; i++) {
      var box = boxes[i];
      var type = null;
      for (var key in TAG_FALLBACK) {
        if (box.classList.contains(key)) { type = key; break; }
      }
      if (!type) continue;

      var name = null;
      var rawLabel = null;
      var echoHandle = null, echoTag = null;
      var firstP = box.querySelector('p');
      var strongEl = firstP ? firstP.querySelector('strong') : null;
      if (strongEl && firstP.textContent.indexOf(strongEl.textContent) === 0) {
        name = strongEl.textContent.trim().replace(/[.:]\s*$/, '');
        var afterNode = strongEl.nextSibling;
        if (afterNode && afterNode.nodeType === Node.TEXT_NODE) {
          var labelMatch = afterNode.data.match(/^\s*\(([^)]+)\)\.?\s*/);
          if (labelMatch) {
            rawLabel = labelMatch[1];
            afterNode.data = afterNode.data.slice(labelMatch[0].length);
          }
        }
        strongEl.parentNode.removeChild(strongEl);
        // Strip a pre-formatted header echo already baked into the
        // body per the locked guide's own convention — its examples
        // show the source written as "**Reality** · *Definition*" or
        // "**Necessary Possibility** · **T1** · *Theorem 1*", i.e.
        // the header text typed directly into the callout, which
        // this script would otherwise duplicate. Bounded to the
        // guide's exact shape (dot, optional bold handle, dot,
        // italic tag) and gated on the first dot actually matching,
        // so it can never eat into real body prose that happens to
        // start with its own bold/italic word. The handle/tag text
        // is captured (not just discarded) before removal — it's
        // already-correct authored data, not just noise to clean up.
        var isPureDot = function (node) {
          return !!node && node.nodeType === Node.TEXT_NODE && /·/.test(node.data) && /^[\s·]+$/.test(node.data);
        };
        // A bare (unformatted) handle sandwiched between the two dots
        // — e.g. "**Change** · C · *Definition*" — collapses into a
        // single text node, since Pandoc only splits out its own node
        // for a genuinely-formatted span (bold/italic); an unadorned
        // symbol like "C" stays fused to its dots instead of arriving
        // as its own STRONG. Matched and bounded to the WHOLE node
        // (dot, handle, dot, nothing else) so it can't misfire on
        // body prose that merely contains a stray interpunct.
        var bareHandleMatch = firstP.firstChild && firstP.firstChild.nodeType === Node.TEXT_NODE
          ? firstP.firstChild.data.match(/^\s*·\s*(\S(?:[^·]*\S)?)\s*·\s*$/)
          : null;
        if (bareHandleMatch) {
          echoHandle = bareHandleMatch[1].trim();
          firstP.removeChild(firstP.firstChild);
          if (firstP.firstChild && firstP.firstChild.nodeName === 'EM') {
            echoTag = firstP.firstChild.textContent.trim();
            firstP.removeChild(firstP.firstChild);
          }
        } else if (isPureDot(firstP.firstChild)) {
          firstP.removeChild(firstP.firstChild);
          if (firstP.firstChild && firstP.firstChild.nodeName === 'STRONG') {
            echoHandle = firstP.firstChild.textContent.trim();
            firstP.removeChild(firstP.firstChild);
          }
          if (isPureDot(firstP.firstChild)) firstP.removeChild(firstP.firstChild);
          if (firstP.firstChild && firstP.firstChild.nodeName === 'EM') {
            echoTag = firstP.firstChild.textContent.trim();
            firstP.removeChild(firstP.firstChild);
          }
        }
        // Fold a same-paragraph italic subtitle (e.g. "**Bilateral
        // Self-Sustenance.** *The Positive Direction.*") into the
        // name when it's the ONLY thing left in the first
        // paragraph — common in premise derivations that open with
        // a named sub-heading before the numbered list, so it isn't
        // orphaned as an unlabeled line of body text.
        //
        // .argument is shared by two catalogued types (the guide's
        // one deliberate exception to one-icon-per-type, both under
        // ♟️): Move and Argument. Move's own gloss always arrives as
        // an interpunct echo ("· *gloss*"), already captured above
        // into echoTag — so if THIS bare bold+italic pattern shows up
        // with no echo already found, it isn't a Move gloss to fold;
        // it's Argument's "result-first" signature, `**Result.**
        // *Name.*` (e.g. "**Necessary Possibility of Change.** *The
        // Lift.*", §2.3) — bold result, then the box's own italic
        // name, shown side by side with no interpunct at all. Stash
        // it in argNameText rather than folding or tagging so the
        // header-building step below can render both halves as-is.
        var argNameText = null;
        var emEl = firstP.querySelector('em');
        if (emEl && firstP.textContent.trim() === emEl.textContent.trim()) {
          if (type === 'argument' && !echoTag) {
            argNameText = emEl.textContent.trim().replace(/\.\s*$/, '');
          } else {
            name = name + ': ' + emEl.textContent.trim().replace(/\.\s*$/, '');
          }
          firstP.removeChild(emEl);
        }
        // If the first paragraph held nothing but the bold name (and
        // optionally the label/subtitle just folded into it above),
        // it's now empty — remove it outright rather than leaving a
        // blank line's worth of gap before the real body content.
        if (!firstP.textContent.trim()) {
          firstP.parentNode.removeChild(firstP);
        }
      }
      if (!name) {
        var section = box.closest('section');
        var heading = section
          ? section.querySelector(':scope > h1, :scope > h2, :scope > h3, :scope > h4, :scope > h5, :scope > h6')
          : null;
        if (heading) {
          var text = heading.textContent.trim();
          var m2 = text.match(/^\d+(?:\.\d+)*\s+(.+)$/);
          name = m2 ? m2[1] : text;
        }
      }
      if (!name) name = TAG_FALLBACK[type] || 'Untitled';

      // Condition: symbol is the bare letter (T/S/Φ), tag is always
      // just "Condition" (no "N of 3" — dropped per the author's
      // final call) — accepts a bare "(T)" label with no prefix as
      // a fallback, and adds a per-letter modifier class so
      // custom.css can give each of the three its own accent color.
      var handle = null, tag = null;
      if (echoTag) {
        // The echo already provided correct, already-authored
        // handle/tag text (see the stripping block above) — use it
        // directly instead of re-deriving from rawLabel/TYPE_RULES.
        handle = echoHandle;
        tag = echoTag;
        if (type === 'condition' && echoHandle && CONDITION_LETTERS[echoHandle]) {
          box.classList.add(CONDITION_LETTERS[echoHandle].mod);
        }
      } else if (type === 'condition') {
        var letter = null;
        // Icon-driven (primary): export-pages.js assigns condition-
        // time/-space/-substance directly from the Notion icon
        // (⏳/🗺️/🪙), so check the class first — no text-parsing
        // needed when the icon mapping already did the job.
        if (box.classList.contains('condition-time')) { letter = 'T'; }
        else if (box.classList.contains('condition-space')) { letter = 'S'; }
        else if (box.classList.contains('condition-substance')) { letter = 'Φ'; }
        else if (rawLabel && /^(T|S|Φ)$/.test(rawLabel.trim())) {
          // Fallback for older content or a miscategorized icon.
          letter = rawLabel.trim();
        }
        var info = letter ? CONDITION_LETTERS[letter] : null;
        tag = 'Condition';
        if (info) {
          handle = letter;
          box.classList.add(info.mod);
        }
      } else if (type !== 'untyped') {
        // untyped (an unmapped icon, not yet classified) shows only
        // its title — no dot, no tag — rather than asserting a type
        // that was never actually confirmed.
        var rule = TYPE_RULES[type];
        if (rule.handleRegex) {
          var hm = rawLabel ? rawLabel.match(rule.handleRegex) : null;
          if (hm) handle = rule.handle(hm);
          tag = rule.tag(hm);
        } else {
          tag = rule.tag(rawLabel);
          // A parenthetical that ISN'T just restating the tag
          // itself (e.g. "(Identification)") and reads as a short
          // symbol (e.g. "(C)" on Change) is that term's own
          // handle, not filler — give it the three-beat header.
          if (rule.bareSymbolOk && rawLabel) {
            var trimmedLabel = rawLabel.trim();
            if (trimmedLabel.toLowerCase() !== tag.toLowerCase() && trimmedLabel.length <= 5) {
              handle = trimmedLabel;
            }
          }
        }
      }

      var header = document.createElement('div');
      header.className = 'box-header';
      var titleSpan = document.createElement('span');
      titleSpan.className = 'box-header-title';
      titleSpan.textContent = argNameText ? name.replace(/[.:]\s*$/, '') + '.' : name;
      header.appendChild(titleSpan);
      if (argNameText) {
        // Argument's result-first format: both halves shown as
        // typed (bold result, italic name), joined by a plain
        // space — no interpunct, no handle/tag beat at all.
        header.appendChild(document.createTextNode(' '));
        var argNameSpan = document.createElement('span');
        argNameSpan.className = 'box-header-tag';
        argNameSpan.textContent = argNameText.replace(/[.:]\s*$/, '') + '.';
        header.appendChild(argNameSpan);
      } else {
        if (handle) {
          header.appendChild(makeDot());
          var handleSpan = document.createElement('span');
          handleSpan.className = 'box-header-handle';
          handleSpan.textContent = handle;
          header.appendChild(handleSpan);
        }
        if (tag) {
          header.appendChild(makeDot());
          var tagSpan = document.createElement('span');
          tagSpan.className = 'box-header-tag';
          tagSpan.textContent = tag;
          header.appendChild(tagSpan);
        }
      }
      box.insertBefore(header, box.firstChild);
    }

    function makeDot() {
      var dotSpan = document.createElement('span');
      dotSpan.className = 'box-header-dot';
      dotSpan.textContent = '·';
      return dotSpan;
    }
  })();

  // ── Read Next/Previous Chapter — replaces the removed prev/next
  // bar ──────────────────────────────────────────────────────────
  // book.page-navigation is off (Quarto's own version of this was
  // deemed redundant with the sidebar/navbar early on), but this
  // hand-built replacement now covers both directions: a previous
  // link at the left edge, a next link at the right, each pointing
  // outward. Built from the left sidebar's own visible entries
  // rather than Quarto's disabled page-navigation data, since
  // that's already the actual linear reading order (hidden entries
  // like Resources/Appendices/back matter are correctly excluded —
  // they were never part of this flow) and is unaffected by
  // page-navigation being off. The home page (index.qmd) opts out
  // entirely — no nav either direction, it just ends after its own
  // last section. The Introduction (body-classes: introduction-
  // page) gets the dedicated "The Inversion begins" text for its
  // *forward* link only, since its actual next spine entry is the
  // "Chapters" part label, not a chapter — its backward link (to
  // the Preface) uses the same generic title-lookup every other
  // page's links do.
  // ── Scroll-triggered reveal (.scroll-reveal, currently just the
  // two closing lines on the Introduction page) ────────────────
  // Each element starts invisible (styles/custom.css) and, on
  // touch devices, fades in the first time it crosses into the
  // viewport — a reader just reaches it by reading/scrolling
  // normally, the same way turning a page reveals what's next.
  // unobserve() after firing once: a one-time reveal, not
  // something that re-hides on scrolling back up past it.
  //
  // On a hover-capable, fine-pointer device (a real mouse or
  // trackpad — window.matchMedia('(hover: hover) and (pointer:
  // fine)'), not just a width breakpoint, so a touch laptop with
  // a mouse plugged in still gets this path) the scroll trigger
  // is skipped entirely: a reader flagged that on an ordinary
  // desktop viewport, the page has usually already scrolled this
  // far into view by the time anyone actually reaches it, so the
  // "reveal" landed with no surprise left in it. A first hover
  // (mouseenter, below) or a click both make the reveal stick
  // permanently — not a peek that un-blurs on approach and
  // re-blurs the moment the pointer moves away, but a one-time
  // reveal exactly like the touch/scroll case, just triggered
  // by the cursor arriving instead of the element scrolling
  // into view. Only the *automatic*, no-interaction-required
  // scroll trigger is what goes away on desktop — clicking or
  // hovering are both still real ways in, exactly as asked for.
  (function () {
    var els = document.querySelectorAll('.scroll-reveal');
    if (!els.length) return;
    els.forEach(function (el) {
      el.addEventListener('click', function () {
        el.classList.add('is-visible');
      });
      el.addEventListener('mouseenter', function () {
        el.classList.add('is-visible');
      });
    });
    var isHoverCapable = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    if (isHoverCapable) return;
    if (!('IntersectionObserver' in window)) {
      // No IntersectionObserver support: reveal immediately
      // rather than leaving the text permanently hidden.
      els.forEach(function (el) { el.classList.add('is-visible'); });
      return;
    }
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.3 });
    els.forEach(function (el) { observer.observe(el); });
  })();

  (function () {
    if (document.body.classList.contains('home-page')) return;

    var isIntroduction = document.body.classList.contains('introduction-page');

    var spineLinks = Array.prototype.filter.call(
      document.querySelectorAll(
        '#quarto-sidebar li.sidebar-item > div.sidebar-item-container > a.sidebar-item-text'
      ),
      function (a) {
        // Section headers (Front Matter, Chapters, ...) match this
        // selector too, but they're collapse toggles with no href,
        // not real spine entries — including them shifts prev/next
        // by one for whatever chapter happens to lead its section.
        if (!a.hasAttribute('href')) return false;
        var li = a.closest('li.sidebar-item');
        if (!li || getComputedStyle(li).display === 'none') return false;
        // Resources (Contribute, License, How to Cite, Changelog) is
        // utility navigation, not reading content — without this a
        // chapter at the head of its section (e.g. Preface) picks up
        // a nonsense "previous" link into that section instead of
        // having none.
        var sectionUl = li.closest('ul.sidebar-section');
        var sectionHeader = sectionUl && sectionUl.previousElementSibling;
        var sectionTitle = sectionHeader && sectionHeader.querySelector('.menu-text');
        if (sectionTitle && sectionTitle.textContent.trim() === 'Resources') return false;
        return true;
      }
    );
    var currentIndex = spineLinks.findIndex(function (a) {
      return a.classList.contains('active');
    });
    if (currentIndex === -1) return;

    // Title only, no "P."/"1." prefix — that number/letter is a
    // sidebar-list device (it reads as a table-of-contents entry
    // there, dot leader and all) that doesn't belong on a plain
    // prose link at the bottom of a chapter. Was including it
    // here too (numSpan.textContent + ' ' + titleOnly), so this
    // footer read "P. Preface" instead of "Preface."
    function titleOf(a) {
      var chapterTitleSpan = a.querySelector('.chapter-title');
      var numSpan = chapterTitleSpan ? chapterTitleSpan.querySelector('.sidebar-chapter-num') : null;
      var fullText = (chapterTitleSpan || a).textContent.trim();
      return numSpan ? fullText.slice(numSpan.textContent.length).trim() : fullText;
    }

    var prevLink = currentIndex > 0 ? spineLinks[currentIndex - 1] : null;
    var nextLink = currentIndex + 1 < spineLinks.length ? spineLinks[currentIndex + 1] : null;

    var prevHref = prevLink ? prevLink.getAttribute('href') : null;
    var prevText = prevLink ? titleOf(prevLink) : null;

    var nextHref = null, nextText = null;
    if (isIntroduction) {
      nextHref = '/book/groundwork.html';
      nextText = 'Groundwork';
    } else if (nextLink) {
      nextHref = nextLink.getAttribute('href');
      nextText = 'Continue reading: ' + titleOf(nextLink);
    }

    if (!prevHref && !nextHref) return;

    var content = document.getElementById('quarto-document-content') ||
                  document.querySelector('main.content');
    if (!content) return;

    var nav = document.createElement('div');
    nav.className = 'next-chapter-nav';
    nav.innerHTML =
      '<span class="next-chapter-flourish" aria-hidden="true"></span>';

    var row = document.createElement('div');
    row.className = 'chapter-nav-row';

    if (prevHref) {
      var prevA = document.createElement('a');
      prevA.className = 'next-chapter-link prev-chapter-link';
      prevA.href = prevHref;
      var prevArrow = document.createElement('span');
      prevArrow.className = 'next-chapter-arrow';
      prevArrow.setAttribute('aria-hidden', 'true');
      prevArrow.textContent = '◂';
      prevA.appendChild(prevArrow);
      prevA.appendChild(document.createTextNode(prevText));
      row.appendChild(prevA);
    } else {
      row.appendChild(document.createElement('span'));
    }

    if (nextHref) {
      var nextA = document.createElement('a');
      nextA.className = 'next-chapter-link';
      nextA.href = nextHref;
      nextA.appendChild(document.createTextNode(nextText));
      var nextArrow = document.createElement('span');
      nextArrow.className = 'next-chapter-arrow';
      nextArrow.setAttribute('aria-hidden', 'true');
      nextArrow.textContent = '▸';
      nextA.appendChild(document.createTextNode(' '));
      nextA.appendChild(nextArrow);
      row.appendChild(nextA);
    } else {
      row.appendChild(document.createElement('span'));
    }

    nav.appendChild(row);

    var footnotes = content.querySelector('.footnotes');
    if (footnotes) {
      footnotes.parentNode.insertBefore(nav, footnotes);
    } else {
      content.appendChild(nav);
    }
  })();

  // ── Mobile: close the hamburger menu on an outside click ─────────
  // Bootstrap's Dropdown component (Appendices/References) already
  // auto-closes on an outside click natively — confirmed live, no
  // fix needed there. Its Collapse component (what the mobile
  // hamburger menu uses) does not have that behavior built in; the
  // only way to close it was the hamburger button itself, acting
  // as a pure on/off toggle. This adds the same "click anywhere
  // else to dismiss" behavior a reader already gets from every
  // other menu on the site.
  (function () {
    var collapseEl = document.querySelector('#quarto-header .navbar-collapse');
    var toggler = document.querySelector('#quarto-header .navbar-toggler');
    if (!collapseEl || !toggler || !window.bootstrap) return;
    document.addEventListener('click', function (e) {
      if (!collapseEl.classList.contains('show')) return;
      if (collapseEl.contains(e.target) || toggler.contains(e.target)) return;
      var instance = window.bootstrap.Collapse.getInstance(collapseEl) ||
        new window.bootstrap.Collapse(collapseEl, { toggle: false });
      instance.hide();
    });
  })();

  // ── Mobile: right-sidebar (Page Contents) slide-in toggle ────────
  // Self-contained drawer (see styles/custom.css section 21) — not
  // reusing the left sidebar's Bootstrap collapse instance, which
  // is wired to a shared class and isn't meant to run a second,
  // independent instance. Symmetric to the left toggle already in
  // this same bar: same position (opposite end), same icon
  // mirrored horizontally via CSS.
  var secondaryNavBar = document.querySelector('.quarto-secondary-nav .container-fluid');
  if (secondaryNavBar && document.getElementById('quarto-margin-sidebar')) {
    var backdrop = document.createElement('div');
    backdrop.className = 'mobile-margin-backdrop';
    document.body.appendChild(backdrop);

    var marginToggle = document.createElement('button');
    marginToggle.type = 'button';
    marginToggle.className = 'btn mobile-margin-toggle';
    marginToggle.setAttribute('aria-label', 'Toggle page contents');
    marginToggle.innerHTML = '<i class="bi bi-layout-text-sidebar-reverse"></i>';
    // Short front-matter pages (Preface, Introduction, Copyright — no
    // ## headings of their own) never get a nav.toc-active from Quarto
    // at all — this used to leave marginToggle un-appended on those
    // pages (inert: never clicked, .contains() always false, so the
    // rest of this block's later references to it still ran safely
    // unchanged), on the reasoning that opening a drawer with nothing
    // in it but the Font/Layout/Dim-margin tools row would read as
    // broken. Reverted on request, same reasoning as the floating
    // toggle's own identical gate above: those tools are global
    // settings, not Page-Contents-specific, and marginToolsHome already
    // builds that row unconditionally — the drawer was never actually
    // empty on a toc-less page, just unreachable at true-mobile widths.
    secondaryNavBar.appendChild(marginToggle);

    // This bar's icon color can't just be hardcoded: Quarto ships
    // two entire compiled stylesheets (light/dark), and
    // .quarto-btn-toggle (the left, native toggle) gets a
    // different literal color baked into each one — hsl(0,0%,35%)
    // in the light bundle, hsl(0,0%,67.93%) in the dark one — not
    // a CSS custom property either build could share with our own
    // stylesheet. A single hardcoded color here matched one theme
    // and silently went wrong in the other (confirmed live: right
    // fine in light mode, visibly duller than the left toggle
    // once dark mode was on). Reading the real, currently-active
    // color straight off the native toggle and copying it over
    // keeps these two in sync in both themes without duplicating
    // Quarto's own theme-swap logic.
    var syncSecondaryNavIconColor = function () {
      var reference = document.querySelector('.quarto-secondary-nav .quarto-btn-toggle');
      if (!reference) return;
      var color = getComputedStyle(reference).color;
      document.querySelectorAll('.mobile-margin-toggle').forEach(function (el) {
        el.style.color = color;
      });
    };
    syncSecondaryNavIconColor();
    new MutationObserver(syncSecondaryNavIconColor).observe(document.body, {
      attributes: true,
      attributeFilter: ['class'],
    });

    // The actual TOC content (nav.toc-active, holding the h2 +
    // link list) has its own display:none independent of the
    // sidebar container's — reason unconfirmed (no matching rule
    // in either custom.css or Quarto's own CSS bundle), so it's
    // forced open directly here rather than left to chase further.
    var tocNav = document.getElementById('quarto-margin-sidebar').querySelector('nav.toc-active');
    var closeMarginDrawer = function () {
      document.body.classList.remove('mobile-margin-open');
      // Also ends a docked-rail Chapter-Contents peek (marginBtn's own
      // click handler, above) — every existing caller of this function
      // (outside click, scroll, resize, opening the left drawer) is
      // already exactly the "something else happened, put the right
      // side back to normal" set of triggers a peek should end on too,
      // so folding it in here instead of a parallel, second listener
      // set keeps both behaviors in sync for free. bookRailPeekRestoreMode
      // (captured when the peek started) is what was really showing
      // before — a no-op if no peek was active.
      if (bookRailPeekActive) {
        bookRailPeekActive = false;
        document.documentElement.classList.remove('book-rail-peek-active');
        bookPeekRailMode(bookRailPeekRestoreMode);
      }
    };
    // Three separate mobile overlays share this same narrow strip
    // of screen — the left chapter-list drawer, this right Page-
    // Contents drawer, and the hamburger's own nav-link list
    // (.navbar-collapse) — and only the left/right pair were ever
    // taught not to stack on each other. Opening the hamburger's
    // menu while the left drawer was already open left both
    // showing at once, the shorter nav-link list floating over
    // only part of the taller drawer behind it with the rest
    // peeking out below (confirmed live as a reader's actual bug,
    // not theoretical) — and it didn't close the left drawer
    // either.
    //
    // The left drawer used to be a real Bootstrap Collapse
    // component (Quarto's own native HTML wires it up, not this
    // file: the toggle button, an empty flex-grow-1 tap-target
    // beside it, AND — previously unaccounted for — a full-viewport
    // #quarto-sidebar-glass backdrop all carry their own
    // data-bs-toggle="collapse" pointed at the shared
    // .quarto-sidebar-collapse-item class). A reader compared this
    // drawer directly against the right one (a plain body-class
    // toggle, no animation-library state machine at all) and found
    // it genuinely desynced under normal tapping — closes but the
    // dim stays, reopens but the dim doesn't come back. Root cause,
    // confirmed live: THREE independent Bootstrap-driven actors
    // could each fire from a single tap (the button, the empty
    // tap-target, and the glass — the glass alone is a real,
    // pointer-events:auto, z-index:1000 full-screen element the
    // instant the drawer opens, confirmed via getComputedStyle/
    // elementFromPoint), on top of Bootstrap's own well-known
    // ~320–350ms transition lock (calling show()/hide() while a
    // previous call is still transitioning is silently swallowed —
    // confirmed live across a systematic timing sweep). Stripping
    // data-bs-toggle from all three the moment the page loads, before
    // any click can reach them, stops Bootstrap's JS from ever
    // touching this drawer; #quarto-sidebar-glass is hidden outright
    // in styles/custom.css, since .mobile-margin-backdrop already
    // does that job for both drawers. Left and right now run the
    // exact same mechanism: one class, toggled directly, no second
    // silent actor and nothing to race.
    var leftSidebarEl = document.getElementById('quarto-sidebar');
    var navCollapseEl = document.querySelector('.navbar-collapse');
    document.querySelectorAll(
      '[data-bs-toggle="collapse"][data-bs-target=".quarto-sidebar-collapse-item"]'
    ).forEach(function (el) {
      el.removeAttribute('data-bs-toggle');
      el.removeAttribute('data-bs-target');
      // Quarto's own template also bakes onclick="if (window.
      // quartoToggleHeadroom) { window.quartoToggleHeadroom(); }" onto
      // both of these elements — a freeze/unfreeze toggle meant to
      // keep the header from hiding while the true-mobile menu is
      // open. It only ever cancels out there because the SAME physical
      // button both opens and closes that menu. Here, the floating
      // icon's own click handler (.book-floating-sidebar-toggle,
      // above) reuses this button's click to OPEN the popup, but
      // closing it happens through a different path entirely (scroll,
      // outside click — closeBothDrawers, below) that never touches
      // this button again, so the toggle only ever fires on open, not
      // close: confirmed live as the actual top navbar getting
      // permanently stuck pinned or unpinned, flipping with every
      // popup open. Removing the attribute here (same moment its
      // Bootstrap-collapse wiring is already being stripped) stops it
      // from ever firing via this button, matching the fact that
      // nothing about opening/closing this popup should touch
      // headroom's freeze state at all in the ranges this icon lives.
      el.removeAttribute('onclick');
    });
    // navCollapseEl (the hamburger's own nav-link list) is untouched
    // by the above — it's a separate, genuine Bootstrap Collapse
    // component in its own right, still closed via its real
    // instance here.
    var closeBootstrapCollapse = function (el) {
      if (!el || !window.bootstrap) return;
      var instance = window.bootstrap.Collapse.getInstance(el);
      if (instance) instance.hide();
    };
    var isLeftOpen = function () {
      return document.body.classList.contains('book-left-drawer-open');
    };
    var openLeftDrawer = function () {
      document.body.classList.add('book-left-drawer-open');
      if (leftSidebarEl) leftSidebarEl.classList.add('book-left-drawer-open');
      closeMarginDrawer();
      closeBootstrapCollapse(navCollapseEl);
    };
    var closeLeftDrawer = function () {
      document.body.classList.remove('book-left-drawer-open');
      if (leftSidebarEl) leftSidebarEl.classList.remove('book-left-drawer-open');
    };
    marginToggle.addEventListener('click', function () {
      var opening = !document.body.classList.contains('mobile-margin-open');
      document.body.classList.toggle('mobile-margin-open');
      if (opening && tocNav) tocNav.style.display = 'block';
      if (opening) {
        closeLeftDrawer();
        closeBootstrapCollapse(navCollapseEl);
      }
    });
    backdrop.addEventListener('click', closeMarginDrawer);
    // Closing the left drawer and opening the right one at the same
    // time would stack two overlays — keep only one open at once.
    // Same plain toggle wired to both of Quarto's native tap targets
    // (the icon button and the empty flex-grow-1 strip beside it) —
    // data-bs-toggle stripped from both above, so this is now the
    // only thing either one does.
    var leftToggleBtn = document.querySelector('.quarto-secondary-nav .quarto-btn-toggle');
    var leftToggleExtra = document.querySelector('.quarto-secondary-nav a.flex-grow-1[aria-controls="quarto-sidebar"]');
    var toggleLeftDrawer = function (e) {
      if (e) e.preventDefault();
      closeMarginDrawer();
      if (isLeftOpen()) closeLeftDrawer(); else openLeftDrawer();
    };
    if (leftToggleBtn) leftToggleBtn.addEventListener('click', toggleLeftDrawer);
    if (leftToggleExtra) leftToggleExtra.addEventListener('click', toggleLeftDrawer);
    // The hamburger's own nav-link list is a fixed, full-width
    // overlay (#quarto-header is position:fixed, z-index:1070) —
    // it never actually reflows the page underneath it, but a
    // solid black box with nothing behind it to read as "the page,
    // darkened" instead looked like it had pushed the page down
    // rather than floated over it (confirmed as a reader's actual
    // complaint, not theoretical). A dimmed backdrop behind it,
    // matching the right drawer's own .mobile-margin-backdrop,
    // makes the underlying page visible-but-dimmed so it reads as
    // an overlay the same way the two side drawers already do.
    // The secondary nav's own left/right toggle icons (§ .quarto-
    // secondary-nav) sit inside that same fixed header and were
    // rendering visible mid-dropdown, sandwiched between the
    // toggler row and the nav-link list — hidden via the same
    // open/close class rather than given their own listener.
    var navCollapseBackdrop = document.createElement('div');
    navCollapseBackdrop.className = 'book-nav-collapse-backdrop';
    document.body.appendChild(navCollapseBackdrop);
    navCollapseBackdrop.addEventListener('click', function () {
      closeBootstrapCollapse(navCollapseEl);
    });
    if (navCollapseEl) {
      navCollapseEl.addEventListener('show.bs.collapse', function () {
        closeMarginDrawer();
        closeLeftDrawer();
        document.body.classList.add('book-nav-collapse-open');
      });
      navCollapseEl.addEventListener('hidden.bs.collapse', function () {
        document.body.classList.remove('book-nav-collapse-open');
      });
    }

    // ── Mobile nav-link submenus (Appendices/References/Resources):
    // a real accordion instead of Bootstrap's own Dropdown component.
    // Dropdown is built for a floating popup, positioned by Popper.js
    // via an inline transform — several rounds of CSS trying to force
    // it into an in-place "button extends downward" shape (position:
    // static, transform: none, clipping the parent to hide Popper's
    // own offset, ...) never fully worked, on request: "the whole
    // button... extends downward... like a drop down menu," not a
    // floating panel. Intercepting the click and driving a plain
    // max-height transition (styles/custom.css's own .mobile-submenu-
    // open rules) sidesteps Popper entirely — this dropdown-toggle
    // never gets to open as a real Bootstrap dropdown at true-mobile
    // width, so Popper never positions anything to fight in the first
    // place. Above 991.98px this same markup is untouched and behaves
    // exactly as Bootstrap's normal floating desktop dropdown always
    // has.
    if (navCollapseEl) {
      var mobileSubmenuToggles = navCollapseEl.querySelectorAll('.nav-item.dropdown > .dropdown-toggle');
      mobileSubmenuToggles.forEach(function (toggle) {
        toggle.addEventListener('click', function (e) {
          if (window.innerWidth > 991.98) return;
          e.preventDefault();
          // stopImmediatePropagation, not just stopPropagation:
          // Bootstrap's own Dropdown listener is either delegated at
          // document level (in which case stopPropagation alone would
          // already keep this click from ever reaching it) or attached
          // directly to this same toggle element (in which case only
          // stopImmediatePropagation, not plain stopPropagation, keeps
          // that separate listener from also firing on this same
          // click). Using the stronger of the two covers both cases
          // without needing to know which one Quarto's bundled
          // Bootstrap actually uses here.
          e.stopImmediatePropagation();
          var li = toggle.closest('.nav-item');
          var isOpen = li.classList.contains('mobile-submenu-open');
          mobileSubmenuToggles.forEach(function (otherToggle) {
            var otherLi = otherToggle.closest('.nav-item');
            if (otherLi !== li) otherLi.classList.remove('mobile-submenu-open');
          });
          li.classList.toggle('mobile-submenu-open', !isOpen);
        });
      });
      // Collapsing the whole hamburger menu should also reset any open
      // submenu, so it doesn't silently reopen already-expanded the
      // next time the hamburger itself is tapped.
      navCollapseEl.addEventListener('hidden.bs.collapse', function () {
        navCollapseEl.querySelectorAll('.nav-item.mobile-submenu-open').forEach(function (li) {
          li.classList.remove('mobile-submenu-open');
        });
      });
    }

    // ── Both drawers: close on outside click, scroll, or resize ──────
    // A reader wanted the left (chapter-list) and right (Page
    // Contents) drawers to behave identically here — until now only
    // the right one had any outside-dismiss behavior at all (via
    // .mobile-margin-backdrop's own click handler above), and even
    // that backdrop is invisible/non-interactive in the 800–
    // 1199.98px range specifically (§24's own comment: a full-page
    // dark tint read as wrong for a drawer that's only a few
    // hundred px wide against a much bigger screen there), so
    // outside-click didn't actually close it at this width either.
    // A plain document-level click listener works regardless of
    // whether a visible backdrop happens to be present — same
    // "outside click closes it" pattern already used for the
    // hamburger's own nav-link list, above, just applied to both
    // side drawers too. isLeftOpen/openLeftDrawer/closeLeftDrawer are
    // defined once, above, and shared by every entry point (the two
    // native tap targets, this outside-click listener, and the
    // scroll/resize listeners below) — one class, one set of
    // functions, nothing left to fall out of sync.
    var isRightOpen = function () {
      return document.body.classList.contains('mobile-margin-open') || bookRailPeekActive;
    };
    var closeBothDrawers = function () {
      if (isLeftOpen()) closeLeftDrawer();
      if (isRightOpen()) closeMarginDrawer();
    };
    // Each drawer has two separate toggle buttons, not one: the
    // true-mobile pair inside .quarto-secondary-nav (leftToggleBtn/
    // marginToggle, <800px) and the 800–1199.98px floating pair
    // (.book-floating-sidebar-toggle/-margin-toggle, built earlier
    // in this same script) — excluding only the first pair left the
    // second pair's own click bubbling up to this same listener,
    // which saw a click outside the drawer/first-pair buttons and
    // closed the drawer the very click that had just opened it
    // (confirmed live: the drawer never stayed open at 1100px,
    // toggle-then-instant-close every time). Both pairs need
    // excluding.
    var leftFloatingToggleBtn = document.querySelector('.book-floating-sidebar-toggle');
    var rightFloatingToggleBtn = document.querySelector('.book-floating-margin-toggle');
    document.addEventListener('click', function (e) {
      if (isLeftOpen() && leftSidebarEl && !leftSidebarEl.contains(e.target) &&
        (!leftToggleBtn || !leftToggleBtn.contains(e.target)) &&
        (!leftToggleExtra || !leftToggleExtra.contains(e.target)) &&
        (!leftFloatingToggleBtn || !leftFloatingToggleBtn.contains(e.target))) {
        closeLeftDrawer();
      }
      var marginEl = document.getElementById('quarto-margin-sidebar');
      if (isRightOpen() && marginEl && !marginEl.contains(e.target) &&
        !marginToggle.contains(e.target) &&
        (!rightFloatingToggleBtn || !rightFloatingToggleBtn.contains(e.target))) {
        closeMarginDrawer();
      }
    });
    // passive: true — this listener only ever reads scroll state to
    // decide whether to close a drawer, never calls
    // preventDefault(), so it shouldn't block the browser's own
    // scroll optimizations the way a non-passive listener can.
    window.addEventListener('scroll', closeBothDrawers, { passive: true });
    window.addEventListener('resize', closeBothDrawers);
  }

});
</script>
