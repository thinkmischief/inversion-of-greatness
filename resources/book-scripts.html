<script src="/resources/sidebar-chapter-numbers.js"></script>
<script>
// Reorder search results to follow the book's own reading order (Preface →
// Introduction → Chapters 1-9 → Conclusion → Excursus) instead of raw
// fuzzy-match score, which a reader found scattered results with no
// relation to book structure (Excursus, then Groundwork, then Relocating
// Greatness...). Patches Fuse.prototype.search — Fuse.js loads in <head>,
// well before this include-after-body script runs, and quarto-search.js
// only calls .search() lazily once a reader types a query, so the patch is
// safely in place before any real search happens. Score is kept only as
// the tiebreaker for multiple hits within the same page.
(function () {
  if (!window.Fuse || !window.Fuse.prototype || Fuse.prototype.__bookOrderPatched) return;
  var BOOK_ORDER = [
    '/front-preface.html', '/front-introduction.html',
    '/groundwork.html', '/the-argument.html', '/convergence.html',
    '/metaphysical-rivals.html', '/rival-ultimates.html',
    '/relocating-greatness.html', '/nature-alone.html',
    '/expanding-the-field.html', '/maximum-possibility.html',
    '/conclusion.html', '/excursus.html'
  ];
  var orderOf = function (href) {
    var page = (href || '').split('#')[0].split('?')[0];
    var i = BOOK_ORDER.indexOf(page);
    return i === -1 ? BOOK_ORDER.length : i;
  };
  var originalSearch = Fuse.prototype.search;
  Fuse.prototype.search = function () {
    var results = originalSearch.apply(this, arguments);
    if (!Array.isArray(results)) return results;
    return results.slice().sort(function (a, b) {
      var oa = orderOf(a.item && a.item.href), ob = orderOf(b.item && b.item.href);
      if (oa !== ob) return oa - ob;
      return (a.score || 0) - (b.score || 0);
    });
  };
  Fuse.prototype.__bookOrderPatched = true;
})();

// Prevent browser from restoring scroll position on refresh/back-nav —
// but not when the URL has a #section fragment, since this fires on the
// 'load' event, which comes after the browser's own scroll-to-anchor and
// was overwriting it, sending anchor links (Index, footnotes, TOC,
// cross-references) back to the page top instead of the target section.
if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }
window.addEventListener('load', function () {
  if (!window.location.hash) window.scrollTo(0, 0);
});

document.addEventListener('DOMContentLoaded', function () {
  // Home page: remove the auto-generated book title block; the
  // .home-title-text-emulation block (index.qmd) replaces it.
  if (document.body.classList.contains('home-page')) {
    var tb = document.getElementById('title-block-header');
    if (tb) tb.remove();
  }

  // Front/back-matter pages only: strip the leading "P."/"I."/"C."/
  // "E." letter label from the page's own H1 — resources/sidebar-
  // chapter-numbers.js already shows that letter as its own column
  // in the sidebar, and a reader felt Preface/Introduction/Conclusion/
  // Excursus aren't really "numbered" the way the 9 main chapters are,
  // so repeating the letter in the page's big heading read as
  // redundant there specifically. The 9 numbered chapters (1–9) keep
  // their leading number on the page itself now — on request, a
  // reversal of this same script's own original behavior (which used
  // to strip digit prefixes too, on the reasoning that ANY leading
  // label was redundant next to the sidebar's copy; a reader decided
  // the numbered chapters read better with the number repeated, the
  // lettered ones still don't). Digit prefixes intentionally excluded
  // from this regex now — matches only [A-Za-z]., not \d+.|[A-Za-z].
  (function () {
    var h1 = document.querySelector('#title-block-header h1.title');
    if (!h1) return;
    var m = h1.textContent.match(/^([A-Za-z]\.)(\s+)(.+)$/);
    if (m) h1.textContent = m[3];
  })();

  // Chapter 7 exception: its own H1 reads "Sola Natura" instead
  // of "Nature Alone" — a deliberate one-off, not a general
  // renaming mechanism. Everywhere else this chapter's real
  // title stays "Nature Alone" untouched: the sidebar, the URL
  // slug (book/nature-alone.html), the browser tab title, and
  // the prev/next chapter-footer links all still say "Nature
  // Alone" — only the big heading a reader sees after clicking
  // into the chapter itself changes.
  // body.nature-alone-page doesn't exist anywhere — nothing in this
  // project ever sets that class, confirmed live via a fresh page's
  // own classList and by grepping this whole file for anything that
  // adds it. This whole exception has silently never fired as a
  // result; invisible until now because the number-stripping IIFE
  // above used to erase this chapter's leading "7." too, so the
  // never-renamed "Nature Alone" and a correctly-renamed-but-never-
  // reached "Sola Natura" would have looked identical either way
  // once flattened chapter-title-first. Matching on the URL instead
  // (same technique the old CHAPTER_SLUGS check nearby used) is what
  // the comment above already describes as the real, load-bearing
  // identifier ("the URL slug (book/nature-alone.html)") — just never
  // actually wired to this specific check.
  if (/nature-alone(\.html)?\/?$/.test(window.location.pathname)) {
    var naH1 = document.querySelector('#title-block-header h1.title');
    if (naH1) {
      // Keeps whatever leading number is already there ("7. ", as of
      // this writing) rather than hardcoding it — this chapter's
      // number-prefix stripping was just reversed (above) specifically
      // so numbered chapters keep their number on the page itself;
      // hardcoding "7." here would silently go stale the next time
      // this book's chapters get renumbered (already happened once —
      // see the D-spine denumbering work elsewhere), quietly dropping
      // the number back off THIS one chapter without anyone noticing.
      var numMatch = naH1.textContent.match(/^(\d+\.)\s+/);
      naH1.textContent = (numMatch ? numMatch[1] + ' ' : '') + 'Sola Natura';
    }
  }

  // ── Reading-mode toggles: mutual exclusion registry ─────────────────
  // Focus mode (dim the side rails) and footnotes-in-the-margin (add
  // content back into the right rail) pull in opposite directions —
  // one wants the periphery emptier, the other wants it fuller — so
  // only one can be on at a time. Each toggle below registers itself
  // here with the class/localStorage key it owns and its own sync()
  // function; bookEnforceExclusive(key) turns every OTHER registered
  // toggle off (class, localStorage, and its own button/icon, via
  // that toggle's own sync()) whenever one of them is switched on.
  var bookExclusiveToggles = {};
  var bookEnforceExclusive = function (activeKey) {
    Object.keys(bookExclusiveToggles).forEach(function (key) {
      if (key === activeKey) return;
      var t = bookExclusiveToggles[key];
      document.documentElement.classList.remove(t.className);
      localStorage.setItem(t.storageKey, 'false');
      t.sync();
    });
  };

  // ── Right-margin content chooser: Page Contents / Gloss / Footnotes ──
  // A separate three-way exclusive group from bookExclusiveToggles above
  // (which assumes every member can independently be "off" at once —
  // true for Focus mode, not true here: the right rail always shows
  // exactly one of these three, never none of them, so "contents" is a
  // real selected state, not an absence). One string attribute rather
  // than a boolean class per mode (the two-way version this replaced
  // used a single 'book-notes-mode' class) — three states don't fit a
  // boolean, and a shared attribute keeps every mode-specific CSS rule
  // and JS check reading the exact same source of truth. Read directly
  // from localStorage, not deferred until the button-construction IIFE
  // runs further down this script — the footnotes-in-margin overlay
  // IIFE (next) needs to know the saved mode immediately on its own,
  // earlier run, the same way its own STORAGE_KEY check always worked
  // regardless of script order.
  var BOOK_RAIL_MODE_KEY = 'book-rail-mode';
  var BOOK_RAIL_MODE_ATTR = 'data-book-rail-mode';
  var bookRailMode = localStorage.getItem(BOOK_RAIL_MODE_KEY) || 'contents';
  document.documentElement.setAttribute(BOOK_RAIL_MODE_ATTR, bookRailMode);
  // Populated by the footnotes-in-margin IIFE below with its own build/
  // teardown sync — the only one of the three modes that needs actual
  // JS work when it turns on/off (Page Contents/Gloss are pure CSS,
  // keyed off the same attribute). Called by bookSetRailMode whenever
  // the mode changes, from wherever in the script the change happens.
  var bookRailModeFootnotesSync = null;
  // Populated further down, once #toc-title exists, with a function that
  // re-labels the right rail's heading to match whichever mode is active
  // (see the "Right sidebar TOC label" block below) — same deferred-
  // registration pattern as bookRailModeFootnotesSync just above, for the
  // same reason: this function is defined later in the script than
  // bookSetRailMode itself, but needs to run every time the mode changes,
  // not just once on load.
  var bookRailModeTocTitleSync = null;
  var bookSetRailMode = function (mode) {
    // A real, persisted switch ends any active peek — both the JS flag
    // and the CSS class that drives the popup overlay. Without this,
    // clicking the persistent top-row Chapter Contents toggle while a
    // peek was active left .book-rail-peek-active on <html>, so the
    // popup CSS kept firing even though bookRailPeekActive was no longer
    // the reason data-book-rail-mode="contents" was set.
    if (bookRailPeekActive) {
      bookRailPeekActive = false;
      bookRailPeekRestoreMode = null;
      document.documentElement.classList.remove('book-rail-peek-active');
    }
    bookRailMode = mode;
    document.documentElement.setAttribute(BOOK_RAIL_MODE_ATTR, mode);
    localStorage.setItem(BOOK_RAIL_MODE_KEY, mode);
    if (bookRailModeFootnotesSync) bookRailModeFootnotesSync();
    if (bookRailModeTocTitleSync) bookRailModeTocTitleSync();
  };
  // Temporary peek, not a real mode change — the docked right rail
  // (Compact mode, or full width with Layout on) defaults to whichever
  // mode is persisted; the floating "Page contents" icon there is only
  // ever shown when that's 'notes' (styles/custom.css), and exists to
  // peek at Chapter Contents for a moment without actually switching
  // the reader's own saved preference. Does update the bookRailMode
  // variable (unlike an earlier version of this function) — both
  // bookRailModeFootnotesSync and syncTocTitle read that variable, not
  // the DOM attribute, to decide what to build/label, so a peek that
  // left it untouched updated the CSS-only Chapter-Contents list but
  // left the previous mode's footnote content built and its own title
  // stale, confirmed live as both showing at once. localStorage is
  // still deliberately untouched — that's the one thing that actually
  // makes this a peek instead of a real switch. bookRailPeekRestoreMode
  // captures whatever bookRailMode was immediately before the peek
  // started, so ending it (marginBtn's own click handler, and the
  // shared drawer-dismiss triggers further down) can put back exactly
  // what was showing, however many pages deep localStorage itself has
  // drifted since — reading localStorage fresh again at restore time
  // would work too, but this is one less place assuming nothing else
  // could have changed it in between.
  var bookRailPeekActive = false;
  var bookRailPeekRestoreMode = null;
  var bookPeekRailMode = function (mode) {
    bookRailMode = mode;
    document.documentElement.setAttribute(BOOK_RAIL_MODE_ATTR, mode);
    if (bookRailModeFootnotesSync) bookRailModeFootnotesSync();
    if (bookRailModeTocTitleSync) bookRailModeTocTitleSync();
  };

  // ── Focus mode ────────────────────────────────────────────────────
  // Dims the left TOC sidebar and the right Page Contents sidebar
  // (styles/custom.css, §FOCUS MODE) — the two rails that sit in the
  // reader's periphery on every page — which brighten back to full
  // opacity on hover so a reader can still glance over and use them
  // without leaving focus mode. The top navbar itself is untouched;
  // it already gets out of the way on its own via scroll-hide. State
  // is a straight boolean in localStorage — same pattern as the
  // right-sidebar TOC-collapse toggle further down — so it carries
  // across page navigation instead of resetting on every load. The
  // include-in-header script above applies the same class before
  // first paint.
  //
  // No standalone icon button here anymore — its only entry point
  // is the settings dropdown's "Dim margin (focus mode)" item
  // further down, which reads/writes this exact registry entry.
  // The dedicated eye icon that used to live in the navbar tools
  // row next to the color-scheme toggle was a second, redundant
  // way to reach the same one setting once the dropdown existed.
  (function () {
    var sync = function () {};
    bookExclusiveToggles.focus = { className: 'book-focus-mode', storageKey: 'book-focus-mode', sync: sync };
  })();

  // ── Footnotes-in-the-margin toggle ───────────────────────────────────
  // Off by default (traditional numbered footnote + endnotes list at
  // the end of the chapter, unchanged either way — this only ever
  // ADDS a second rendering alongside it, never removes it, so PDF/
  // EPUB output and the plain endnotes list are untouched). On:
  // clones each footnote's own content out to a Tufte-style sidenote
  // positioned in the right margin, next to the paragraph that cites
  // it — and, since that's the same rail Page Contents already lives
  // in, hides Page Contents outright for as long as margin notes
  // stay on (see hidePageContents below), rather than the two
  // sharing that space at once. display:none, not the TOC's own
  // collapsed-header state (an earlier version tried folding it down
  // to just its header line instead of hiding it outright, reusing
  // the manual collapse-on-click mechanism further down in this
  // script) — that left a visible collapsed header behind even on a
  // plain page load once a reader had ever turned margin notes on,
  // since a Bootstrap-collapse class is DOM state, not something
  // scoped to this feature being active. Plain display:none swapped
  // directly on the element itself avoids touching that mechanism,
  // its class, or its own localStorage preference at all — Page
  // Contents reverts to exactly whatever it would have looked like
  // if this feature had never touched it, every time margin notes
  // go back off.
  //
  // Quarto's own .column-margin grid-column CSS (styles/custom.css
  // never had to touch it, it's Quarto's own) only actually places an
  // element in the margin when that element is a DIRECT child of the
  // #quarto-content grid — confirmed by testing it live: a
  // .column-margin div nested inside this book's section.level2/
  // level3 wrappers (which is where every citing paragraph actually
  // lives) computes the right grid-column value but renders with zero
  // visual effect, because grid-column only does anything for an
  // element that's a direct grid item, and section.level2/level3
  // aren't display:grid themselves. So this doesn't lean on grid
  // placement at all: it builds ONE direct-child overlay (which
  // *does* get correctly placed in the margin column by that same
  // Quarto CSS) and absolute-positions each note inside it at a `top`
  // measured directly off its citing reference's own
  // getBoundingClientRect() — the same live-measurement pattern
  // already used elsewhere on this page (navbar edges, secondary-nav
  // height) for exactly this reason: it works regardless of how
  // deeply the citing paragraph is nested. Alignment is therefore
  // only as good as that one measurement, taken on build and
  // recomputed on resize/font-load — not pixel-locked to the exact
  // line the citation appears on, just to the paragraph's own top.
  (function () {
    var quartoContent = document.getElementById('quarto-content');
    var content = document.getElementById('quarto-document-content');
    // :not(.quarto-sidebar-toggle-contents) — see marginToolsHome
    // above for why a bare id lookup here risks grabbing Quarto's
    // own hidden mobile-drawer clone instead of the real sidebar.
    var marginSidebar = document.querySelector('#quarto-margin-sidebar:not(.quarto-sidebar-toggle-contents)');
    if (!quartoContent || !content) return;
    var refs = Array.prototype.slice.call(content.querySelectorAll('a.footnote-ref'));
    if (!refs.length) return; // nothing to do on a page with no footnotes

    var overlay = document.createElement('div');
    overlay.id = 'book-footnote-margin-overlay';
    overlay.className = 'column-margin';
    quartoContent.insertBefore(overlay, marginSidebar ? marginSidebar.nextSibling : content);

    var built = false;

    // Hiding Page Contents while margin notes are on is done via
    // CSS (styles/custom.css, keyed off the html.book-footnotes-
    // margin class sync() already sets below), not JS toggling
    // .style.display directly here — #quarto-toc-toggle, a SECOND
    // copy of the entire Page Contents nav that Quarto's own JS
    // builds at runtime (confirmed live: it's nowhere in the
    // rendered page source, only appears once quarto.js has run;
    // discovered by finding two live elements sharing the id
    // "toc-title" after hiding just #quarto-margin-sidebar left
    // this second copy showing through on its own), might not
    // exist in the DOM yet at whatever point build()/teardown()
    // happen to run relative to Quarto's own script. A CSS rule
    // keyed off a class doesn't care when a matching element
    // arrives; a one-time JS .style.display assignment does.

    // Collision avoidance: each note's "natural" top (its own
    // citing reference's position) can land it overlapping the
    // note before it, when two footnotes cite close together in
    // the source — confirmed live on a chapter with 175 footnotes,
    // where several sat only ~90px apart while running several
    // lines tall, overlapping into unreadable stacked text. Notes
    // are already in source/DOM order (refs.forEach below builds
    // them in citation order), so a single top-to-bottom pass
    // fixes it: push a note down to clear the previous one's own
    // bottom edge, plus a fixed gap, whenever its natural position
    // would land it higher than that. A note can end up sitting
    // measurably below its actual citation this way — a deliberate
    // trade for "always readable" over "always exactly aligned."
    var MIN_NOTE_GAP = 14;
    var positionNotes = function () {
      var baseTop = overlay.getBoundingClientRect().top + window.scrollY;
      var prevBottom = -Infinity;
      Array.prototype.forEach.call(overlay.querySelectorAll('.book-footnote-margin'), function (note) {
        var ref = document.getElementById(note.getAttribute('data-book-ref-id'));
        if (!ref) return;
        var refTop = ref.getBoundingClientRect().top + window.scrollY;
        var naturalTop = Math.max(0, refTop - baseTop);
        var top = Math.max(naturalTop, prevBottom + MIN_NOTE_GAP);
        note.style.top = top + 'px';
        prevBottom = top + note.offsetHeight;
      });
    };

    var build = function () {
      if (built) return;
      built = true;
      refs.forEach(function (ref) {
        // Not ref.getAttribute('href'): Quarto's own footnote-hover-
        // preview init (quarto.js) rewrites this attribute to a
        // fully-resolved absolute URL (plus a data-original-href
        // that, confirmed live, gets the same resolved value — not
        // actually the original) before this script ever sees it, so
        // the raw attribute is never reliably "#fn1" by the time we
        // read it. The .href PROPERTY is always a resolved absolute
        // URL regardless of which state the attribute is in, so
        // pulling the fragment off THAT is the one path that works
        // whether this runs before or after Quarto's own script.
        var hashIndex = ref.href.indexOf('#');
        var targetId = hashIndex !== -1 ? ref.href.slice(hashIndex + 1) : null;
        var fnEl = targetId ? document.getElementById(targetId) : null;
        if (!fnEl) return;
        var note = document.createElement('div');
        note.className = 'book-footnote-margin';
        note.setAttribute('data-book-ref-id', ref.id);
        var numSpan = document.createElement('span');
        numSpan.className = 'book-footnote-margin-num';
        numSpan.textContent = ref.textContent.trim();
        note.appendChild(numSpan);
        var clone = fnEl.cloneNode(true);
        var backlink = clone.querySelector('a.footnote-back');
        if (backlink) backlink.remove();
        while (clone.firstChild) note.appendChild(clone.firstChild);
        overlay.appendChild(note);
      });
      positionNotes();
    };

    var teardown = function () {
      if (!built) return;
      built = false;
      overlay.innerHTML = '';
    };

    // Reads the shared rail-mode attribute (bookRailMode, above) instead
    // of its own independent boolean — this is one of two mutually
    // exclusive right-margin content choices (Page Contents / Notes,
    // the latter combining Gloss and Footnotes into one merged view on
    // request — a reader wanted both margin-note types reachable
    // together instead of switching back and forth), not a standalone
    // on/off toggle paired with Focus mode. bookRailMode (module-level
    // variable, already initialized from localStorage on this same
    // script's first line, before this IIFE runs) rather than reading
    // localStorage directly here too — the two stay equal for every
    // real, persisted mode change (bookSetRailMode always writes both
    // together), but only the variable also reflects a temporary
    // peek (bookPeekRailMode, deliberately localStorage-independent —
    // see its own comment).
    //
    // bookRailPeekActive is checked too, on request: a momentary peek
    // at Chapter Contents (the docked right icon, Compact mode) should
    // pop it open over the notes without tearing them down — "it
    // should not remove margin notes in the right side column." A
    // REAL, persisted switch to Chapter Contents mode (the settings-
    // menu button, bookSetRailMode) still tears this down exactly as
    // before; only bookRailMode reading 'contents' because of an
    // active peek is exempted. (An earlier version of this fix read
    // bookRailMode without this exception — confirmed live as its own
    // bug the opposite direction: a peek changed the DOM attribute and
    // the CSS-only Chapter-Contents list right along with it, but this
    // build/teardown ran anyway, tearing the notes down for what was
    // only ever meant to be a momentary look.)
    var sync = function () {
      var on = bookRailMode === 'notes' || bookRailPeekActive;
      if (on) {
        build();
      } else {
        teardown();
      }
    };

    window.addEventListener('resize', function () {
      if (built) positionNotes();
    });
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () {
        if (built) positionNotes();
      });
    }

    // Hands this mode's own build/teardown to bookSetRailMode (above)
    // so switching to/from "footnotes" from anywhere else in the script
    // (the margin quick-toggle buttons, further down) actually runs it.
    bookRailModeFootnotesSync = sync;

    sync();
  })();

  // ── Annotation-database margin notes, relocated ──────────────────────
  // attach-margin-notes.js inserts each note as ::: {.column-margin
  // .book-annotation-note}, right after the paragraph it annotates —
  // which, in a real chapter, is almost always nested inside a
  // section.level2/level3 wrapper, not a direct child of #quarto-
  // content. Same root problem the footnote-margin overlay above
  // exists to solve (see its own header comment for the full
  // reasoning): grid-column: body-end / page-end only does anything
  // for an element that's a direct grid item, so a .column-margin div
  // buried in a section either does nothing or — once that section
  // gets forced into its own nested grid to try to fix that (styles/
  // custom.css's .page-full notes) — resolves against the wrong,
  // section-sized tracks entirely.
  //
  // Unlike footnotes, there's no endnotes-list fallback here: a
  // .book-annotation-note is the ONLY copy of its content, so it can't
  // just be torn down at narrow widths the way the optional footnote
  // overlay is. This only relocates notes at >=1120px, where the
  // docked margin rail this overlay lives in actually exists to
  // receive them (matching the right rail's own real docking floor —
  // this used to read >=1200px, which was already stale/inconsistent
  // with nav#TOC's own CSS floor even before the 3-stage consolidation
  // that finally caught it); below that breakpoint every note is left
  // exactly where attach-margin-notes.js put it, so Quarto's own
  // responsive stacking (which already handles a nested .column-margin
  // correctly once the whole layout drops to one column) keeps
  // working unchanged.
  (function () {
    var quartoContent = document.getElementById('quarto-content');
    var content = document.getElementById('quarto-document-content');
    if (!quartoContent || !content) return;
    var innerNotes = Array.prototype.slice.call(content.querySelectorAll('.book-annotation-note'));
    if (!innerNotes.length) return;

    var overlay = document.createElement('div');
    overlay.id = 'book-annotation-note-overlay';
    overlay.className = 'column-margin';

    // Captured once, up front, before anything moves: each note's own
    // anchor is the paragraph attach-margin-notes.js inserted it
    // directly after in the source, which never moves and keeps
    // reporting its real position across reflows/resizes — the same
    // reason the footnote overlay above measures the citing ref
    // instead of the note itself. quartoWrapper is Quarto's own
    // auto-generated container around the fenced div (confirmed live:
    // <div class="no-row-height column-margin column-container">) —
    // left in place as a hidden anchor point for teardown, rather than
    // moved itself, so nothing has to be reconstructed from scratch
    // when a note comes back out of the overlay.
    var entries = innerNotes.map(function (inner) {
      var quartoWrapper = (inner.parentElement && inner.parentElement.classList.contains('column-margin'))
        ? inner.parentElement
        : inner;
      var box = document.createElement('div');
      box.className = 'book-annotation-note-box';
      return { inner: inner, quartoWrapper: quartoWrapper, anchor: quartoWrapper.previousElementSibling, box: box };
    });

    var built = false;
    var MIN_NOTE_GAP = 14;

    // nav#TOC (Page Contents) isn't actually placed by this same grid
    // track at >=1200px — it's pulled out to position: fixed, left
    // computed from --book-navbar-bar-left/-width (JS-measured,
    // setBarBounds above), not from the grid at all. That's a second,
    // independent coordinate system computing what should be the same
    // number, and confirmed live the two don't quite agree (off by a
    // few px — scrollbar-width/rounding, not a real disagreement about
    // where the rail belongs). Reading nav#TOC's own live rect
    // directly and matching left/width to it exactly — the same
    // "measure, don't recompute in a second system" approach
    // setBarBounds and the footnote overlay above already use — is
    // simpler than trying to make the grid track and the fixed-
    // position calc() agree in the abstract, and it's the literal
    // thing being asked for: same box, same edge, not just the same
    // formula.
    var alignToToc = function () {
      var tocEl = document.querySelector('#quarto-margin-sidebar nav#TOC');
      if (!tocEl) return;
      var tocRect = tocEl.getBoundingClientRect();
      var overlayRect = overlay.getBoundingClientRect();
      entries.forEach(function (e) {
        e.box.style.left = (tocRect.left - overlayRect.left) + 'px';
        e.box.style.width = tocRect.width + 'px';
      });
    };

    var positionNotes = function () {
      alignToToc();
      var baseTop = overlay.getBoundingClientRect().top + window.scrollY;
      var prevBottom = -Infinity;
      entries.forEach(function (e) {
        if (!e.anchor) return;
        var anchorTop = e.anchor.getBoundingClientRect().top + window.scrollY;
        var naturalTop = Math.max(0, anchorTop - baseTop);
        var top = Math.max(naturalTop, prevBottom + MIN_NOTE_GAP);
        e.box.style.top = top + 'px';
        prevBottom = top + e.box.offsetHeight;
      });
    };

    var build = function () {
      if (built) return;
      built = true;
      var marginSidebar = document.querySelector('#quarto-margin-sidebar:not(.quarto-sidebar-toggle-contents)');
      quartoContent.insertBefore(overlay, marginSidebar ? marginSidebar.nextSibling : content);
      entries.forEach(function (e) {
        e.quartoWrapper.style.display = 'none';
        e.box.appendChild(e.inner);
        overlay.appendChild(e.box);
      });
      positionNotes();
    };

    var teardown = function () {
      if (!built) return;
      built = false;
      entries.forEach(function (e) {
        e.quartoWrapper.style.display = '';
        e.quartoWrapper.appendChild(e.inner);
        if (e.box.parentElement) e.box.parentElement.removeChild(e.box);
      });
      if (overlay.parentElement) overlay.parentElement.removeChild(overlay);
    };

    var sync = function () {
      if (window.innerWidth >= 1120) {
        build();
        positionNotes();
      } else {
        teardown();
      }
    };

    window.addEventListener('resize', sync);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () {
        if (built) positionNotes();
      });
    }

    sync();
  })();

  // ── Margin-note fade scrim ────────────────────────────────────────
  // Plugs a real gap the annotation-note overlay above leaves open: a
  // scrolling note can pass directly underneath .book-margin-tools
  // (the Eye/Layout/Font/Palette icon row, top: 0–52px), reading as
  // illegible crossed-over text. The icons can't just get a higher
  // z-index than the overlay — they're a DOM descendant of #quarto-
  // margin-sidebar, itself position: fixed with its own z-index
  // (1071), and a positioned ancestor's own non-auto z-index traps
  // every descendant's z-index inside that one context (styles/
  // custom.css's own z-index comments hit this same wall more than
  // once already); the overlay's 1072 is compared one level up,
  // against #quarto-margin-sidebar's 1071 directly, not against
  // anything nested inside it, so no z-index on the icon row itself
  // can ever outrank it. Reparenting the icon row out from under
  // #quarto-margin-sidebar to escape that trap was the other option
  // considered — rejected: rescueMarginSidebar below specifically
  // looks for a populated .book-margin-tools INSIDE #quarto-margin-
  // sidebar to tell Quarto's real rail apart from its own duplicate
  // mobile-drawer clone, and moving the icon row out would break that
  // detection. This sidesteps the fight instead of winning it: a
  // plain, content-free div, built once here as a genuine sibling of
  // the overlay (so ITS z-index competes at the right level without
  // touching the icon row's own DOM position at all), painted in
  // styles/custom.css with a solid-to-transparent gradient in the
  // exact chrome color. Notes scrolling up behind it fade to invisible
  // before they ever reach the icons, instead of visibly crossing
  // them — the "fade" a reader suggested as an alternative to moving
  // anything behind anything else.
  (function () {
    var quartoContent = document.getElementById('quarto-content');
    var content = document.getElementById('quarto-document-content');
    if (!quartoContent || !content) return;
    // Unscoped, not content.querySelector(...) — same bug as the
    // Table of Contents/Notes toggle pair's own guard hit and fixed:
    // the annotation-note overlay IIFE just above this one already
    // moved every .book-annotation-note OUT of #quarto-document-
    // content by the time this runs, on any page ≥1200px wide.
    //
    // Was gated on .book-annotation-note (Gloss) alone — from before
    // Gloss and Footnotes merged into one Notes mode (chooseRailMode's
    // own header comment has that history). Left that way, this scrim
    // silently never built at all on a footnotes-only chapter (most of
    // them — Gloss notes are rare, Footnotes are everywhere), so the
    // exact bleed-through bug this scrim exists to fix was still fully
    // live on every one of those pages, just never noticed because
    // testing happened to focus on Gloss-bearing chapters. Matches
    // hasFootnotes' own check elsewhere in this file (the Notes button
    // itself).
    var hasGlossNotes = !!document.querySelector('.book-annotation-note');
    var hasFootnoteRefs = !!document.querySelector('#quarto-document-content a.footnote-ref');
    if (!hasGlossNotes && !hasFootnoteRefs) return;
    var marginSidebar = document.querySelector('#quarto-margin-sidebar:not(.quarto-sidebar-toggle-contents)');
    var scrim = document.createElement('div');
    scrim.id = 'book-margin-fade-scrim';
    quartoContent.insertBefore(scrim, marginSidebar ? marginSidebar.nextSibling : content);
  })();

  // ── Font/Layout/Palette/Dim-margin's new home: right sidebar ─────
  // A reader wanted these out of the navbar entirely (which is
  // becoming a floating nav-link-only overlay, see further below)
  // and into the top of the right margin sidebar instead, above
  // its Page Contents list. Built once, early, so the buildMenu
  // factory and the Dim-margin quick-toggle IIFE below both have
  // somewhere to insert into. Falls back to the old navbar tools
  // slot on any page with no #quarto-margin-sidebar at all (thin
  // pages with no ##-level headings to populate a Page Contents
  // list) — better a toggle in a less-ideal spot than missing
  // entirely on those pages.
  var marginToolsHome = (function () {
    var marginSidebar = document.getElementById('quarto-margin-sidebar');
    if (!marginSidebar) return document.querySelector('#quarto-header .quarto-navbar-tools');
    var el = document.createElement('div');
    el.className = 'book-margin-tools';
    marginSidebar.insertBefore(el, marginSidebar.firstChild);
    return el;
  })();

  // One shared box, right sidebar — mirrors .book-sidebar-content
  // on the left (title/search/"Table of Contents"/chapter-list all
  // physically live inside one wrapper there too). marginToolsHome
  // just above only inserts the (still-empty) tools row; the
  // Font/Layout/Palette/Dim-margin buttons themselves get built
  // into it by later code in this same script.
  //
  // rescueMarginSidebar, below, is the one that actually matters
  // for whether any of this is visible at all. This is NOT a
  // duplicate-id situation (unlike #toc-title/#TOC elsewhere in
  // this file) — there is only ever one #quarto-margin-sidebar.
  // What's actually happening, confirmed live by walking its own
  // parentElement chain: at some point after this script's own
  // synchronous run, Quarto's own bundled JS — setting up the
  // mobile Page-Contents drawer — ends up with a SECOND element
  // also carrying id="quarto-margin-sidebar" (confirmed live via
  // document.querySelectorAll: count briefly goes to 2), nested
  // inside a hidden #quarto-toc-toggle wrapper (class
  // zindex-over-content quarto-sidebar-toggle headroom-target,
  // display: none). getElementById only ever returns one of the
  // two, and which one drifts across page loads — confirmed live
  // on Groundwork specifically (this book's heaviest page, so
  // the slowest to reach this point, giving Quarto's own script
  // the most time to act before ours checks). A MutationObserver
  // watching the whole document catches this regardless of
  // timing rather than guessing at a fixed delay: whenever the
  // real, correctly-built one (found by checking which
  // candidate's own .book-margin-tools has actually got sized
  // children, not just by node identity) isn't the one sitting
  // in #quarto-content, move it there. z-index + position:
  // relative on the rescued node specifically (not the bare
  // #quarto-margin-sidebar selector, which would equally apply
  // to Quarto's own leftover, still-live-and-still-position:
  // fixed second copy and so not actually resolve anything) is
  // what stops that abandoned copy — same CSS, same fixed
  // coordinates, painting on top by DOM-order default — from
  // silently intercepting real clicks meant for the tools
  // underneath it, confirmed live via elementFromPoint().
  var rescueMarginSidebar = function () {
    var quartoContent = document.getElementById('quarto-content');
    if (!quartoContent) return;
    var candidates = document.querySelectorAll('#quarto-margin-sidebar');
    var real = null;
    for (var i = 0; i < candidates.length; i++) {
      var t = candidates[i].querySelector('.book-margin-tools');
      if (t && t.children.length > 0) { real = candidates[i]; break; }
    }
    if (!real) real = candidates[0];
    if (!real) return;
    if (real.parentElement !== quartoContent) quartoContent.appendChild(real);
    real.style.zIndex = '5';
    // .book-margin-tools itself carries leftover inline styles
    // (opacity: 0; overflow: hidden; pointer-events: none) —
    // Bootstrap's own Collapse component's hidden/collapsed-
    // state styling, applied while this element sat inside
    // #quarto-toc-toggle's collapse target. Moving the node
    // (above) doesn't clear styles already set directly on it;
    // confirmed live this is what was actually making the tools
    // row invisible and unclickable (elementFromPoint() landed
    // on #quarto-margin-sidebar itself, right where a real click
    // would too), not the reparenting by itself. Clearing them
    // lets styles/custom.css's own rules (display: flex etc.)
    // apply normally again.
    var tools = real.querySelector('.book-margin-tools');
    if (tools && tools.hasAttribute('style')) {
      tools.style.opacity = '';
      tools.style.overflow = '';
      tools.style.pointerEvents = '';
    }
  };
  rescueMarginSidebar();
  new MutationObserver(rescueMarginSidebar).observe(
    document.body,
    { childList: true, subtree: true }
  );

  // ── Preference menus: Font / Layout / Palette ───────────────────────
  // Three top-level dropdowns, not one combined gear — went
  // through several shapes this project (Theme/Margin/Typography,
  // then folded into one "Settings" gear, now split again along
  // clearer lines): Font (typeface + size), Layout (Indentation/
  // Spacing/Alignment), and Palette (theme), each its
  // own icon in the navbar rather than nested behind a single
  // gear. buildMenu is the shared factory all three (and the
  // margin quick-toggles' anchor lookup) rely on. Same
  // interaction pattern as the existing top-nav dropdowns
  // ("Appendices" etc.) — real Bootstrap dropdown markup, not custom
  // open/close logic, so outside-tap-dismiss and positioning are
  // inherited for free. data-bs-auto-close="outside": the default
  // Bootstrap behavior closes the whole menu after every single item
  // click, which would be actively hostile here — a reader toggling
  // two things in one visit shouldn't have to reopen the menu
  // between them. Replaces Quarto's own dark-mode toggle in its
  // navbar slot; that toggle's element is hidden (not removed —
  // Quarto's own pre-paint sentinel script queries it directly) and
  // its function moves inside the Palette dropdown, still driven
  // through window.quartoToggleColorScheme() rather than
  // reimplemented.
  (function () {
    var tools = marginToolsHome;
    if (!tools) return;
    var nativeColorToggle = document.querySelector('#quarto-header .quarto-color-scheme-toggle');
    if (nativeColorToggle) {
      nativeColorToggle.style.display = 'none';
    }

    // Builds the one dropdown's chrome (toggle button + menu +
    // item-building helpers) and inserts it into the tools row
    // immediately, returning the helpers for the caller to
    // populate.
    var buildMenu = function (icon, title, extraMenuClass) {
      var wrap = document.createElement('div');
      wrap.className = 'dropdown book-settings-dropdown';

      var toggle = document.createElement('a');
      toggle.href = '';
      toggle.className = 'quarto-navigation-tool px-1 dropdown-toggle';
      toggle.setAttribute('role', 'button');
      toggle.setAttribute('data-bs-toggle', 'dropdown');
      toggle.setAttribute('data-bs-auto-close', 'outside');
      // display: static — takes Popper out of the loop entirely.
      // With Popper (the default), these menus kept opening
      // rightward off the edge of the sidebar and over the
      // reading column no matter what: confirmed live,
      // data-popper-placement stayed "bottom-start" even with
      // the dropdown-menu-end class present (which should mean
      // "end"-aligned/opens left) and even after trying
      // data-bs-boundary="viewport" to fix Popper's own flip
      // decision. "static" sidesteps that whole decision:
      // Bootstrap just applies dropdown-menu-end's plain CSS
      // (right: 0; left: auto, relative to the toggle's own
      // .book-settings-dropdown parent, already position:
      // relative) with no Popper placement math involved.
      toggle.setAttribute('data-bs-display', 'static');
      toggle.setAttribute('aria-expanded', 'false');
      toggle.title = title;
      var toggleIcon = document.createElement('i');
      toggleIcon.className = 'bi ' + icon;
      toggle.appendChild(toggleIcon);

      var menu = document.createElement('ul');
      menu.className = 'dropdown-menu dropdown-menu-end book-settings-menu' +
        (extraMenuClass ? ' ' + extraMenuClass : '');

      wrap.appendChild(toggle);
      wrap.appendChild(menu);

      // Portal the open menu to <body>. Every CSS-only fix tried
      // here (z-index on the menu, then on its wrapper, plus
      // isolation and a forced compositing layer) still left the
      // menu painting underneath the chapter's Page Contents list
      // (nav#TOC) and, per a reader's report, the reading column
      // itself — some stacking/compositing interaction with
      // #quarto-margin-sidebar (position: sticky + overflow-y:
      // auto) that never fully resolved. Moving the actual menu
      // element to the end of <body> while it's open sidesteps
      // all of that: nothing inside the sidebar's own stacking
      // context can trap it if it isn't a descendant of that
      // context anymore. position: fixed + coordinates read off
      // the toggle's own rect (not Bootstrap's Popper, already
      // disabled via data-bs-display: static above) keeps it
      // anchored to the toggle regardless of where in the DOM it
      // physically lives.
      wrap.addEventListener('show.bs.dropdown', function () {
        // Font's own header clone (.book-navbar-font-toggle, true
        // mobile only) moved the real toggle off-screen (styles/
        // custom.css) so Bootstrap would still treat it as a visible,
        // toggleable element — but that also means ITS rect is now
        // off-screen, and anchoring the popup there would put the
        // popup off-screen too. Anchor off the clone's own rect
        // instead whenever it's the thing a reader actually clicked
        // (visible = true mobile width, this menu specifically).
        var mobileClone = title === 'Font' ? document.querySelector('.book-navbar-font-toggle') : null;
        var usingMobileClone = mobileClone && getComputedStyle(mobileClone).display !== 'none';
        var r = usingMobileClone ? mobileClone.getBoundingClientRect() : toggle.getBoundingClientRect();
        // Right edge normally comes from the toggle icon's own rect —
        // fine when there's no docked margin rail to relate to, but at
        // wider widths that let the menu land shifted left of the
        // rail instead of sitting over it (a reader's own report:
        // "popping up to the left of it" instead of over the side
        // menu). #quarto-margin-sidebar's own right edge is a few
        // dozen px further right than the icon row's, since the rail
        // itself is a wider column than any one icon in it — using
        // the rail's edge when it's actually docked on-screen (right
        // between 0 and the viewport width; off-canvas widths park it
        // at a large negative right instead) lines the menu up with
        // the column it's meant to sit over. Skipped entirely when
        // using the mobile clone's own rect above — that rect is
        // already the right anchor (the header icon itself), and the
        // drawer's own rect (open or not) has nothing to do with it.
        var marginSidebar = usingMobileClone ? null : document.getElementById('quarto-margin-sidebar');
        var rightEdge = r.right;
        if (marginSidebar) {
          var mr = marginSidebar.getBoundingClientRect();
          if (mr.right > 0 && mr.right <= window.innerWidth) rightEdge = mr.right;
        }
        menu.style.position = 'fixed';
        menu.style.top = (r.bottom + 4) + 'px';
        menu.style.right = (window.innerWidth - rightEdge) + 'px';
        menu.style.left = 'auto';
        menu.style.margin = '0';
        document.body.appendChild(menu);
      });
      wrap.addEventListener('hide.bs.dropdown', function () {
        wrap.appendChild(menu);
        menu.style.position = '';
        menu.style.top = '';
        menu.style.right = '';
        menu.style.left = '';
        menu.style.margin = '';
      });

      var syncFns = [];

      var addLabel = function (text) {
        var li = document.createElement('li');
        li.className = 'book-settings-label';
        li.textContent = text;
        menu.appendChild(li);
      };
      var addDivider = function () {
        var li = document.createElement('li');
        var hr = document.createElement('hr');
        hr.className = 'dropdown-divider';
        li.appendChild(hr);
        menu.appendChild(li);
      };
      // One item, active state re-derived (not separately tracked)
      // by isActive() every time anything changes — so the check-
      // mark can never drift out of sync with whatever actually
      // applied the underlying change (including changes made
      // from outside this menu, e.g. another exclusive toggle
      // winning).
      // `label` is usually a plain string, but accepts a DOM
      // node too (Procyon Light/Dark below want an interpunct
      // and an italicized variant word — not expressible as
      // one plain string) — appended as-is when it's already
      // a Node, wrapped in a text node otherwise.
      var addOption = function (label, onClick, isActive) {
        var li = document.createElement('li');
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'dropdown-item book-settings-option';
        // No checkmark — the active background tint + gold text
        // (.book-settings-option.active) already mark which one is
        // picked; a reader felt the check was redundant next to
        // those.
        btn.appendChild(label instanceof Node ? label : document.createTextNode(label));
        btn.addEventListener('click', function (e) {
          e.preventDefault();
          onClick();
          syncFns.forEach(function (fn) { fn(); });
        });
        li.appendChild(btn);
        menu.appendChild(li);
        syncFns.push(function () {
          btn.classList.toggle('active', isActive());
        });
        return btn;
      };
      var addDisabledOption = function (label, note) {
        var li = document.createElement('li');
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'dropdown-item book-settings-option disabled';
        btn.disabled = true;
        btn.appendChild(document.createTextNode(label));
        if (note) {
          var noteEl = document.createElement('span');
          noteEl.className = 'book-settings-note';
          noteEl.textContent = note;
          btn.appendChild(noteEl);
        }
        li.appendChild(btn);
        menu.appendChild(li);
      };
      // A group label plus its row of small icon tiles, sharing
      // one line — label on the left, tiles right-aligned —
      // rather than a label on its own line above (a reader
      // asked for this after four stacked, unlabeled-until-
      // hover rows in the Typography menu read as harder to
      // scan than it should have). Same active/sync wiring as
      // addOption above, just laid out as a compact row instead
      // of one-per-line text. Each tile takes either an `icon`
      // (a bi-* class) or a `glyph` (plain text, e.g. "A"/"Aa"
      // at a custom size/font for the text-size and font-family
      // groups) plus a short `label` caption underneath.
      // `disabled` tiles (Reader's Gloss) render dimmed and
      // never wire up a click or a sync() — permanently inert
      // until the feature exists.
      var addTileGroup = function (label, tiles) {
        var li = document.createElement('li');
        li.className = 'book-settings-tile-group';
        var labelEl = document.createElement('span');
        labelEl.className = 'book-settings-tile-group-label';
        labelEl.textContent = label;
        li.appendChild(labelEl);
        var row = document.createElement('div');
        row.className = 'book-settings-tile-row';
        tiles.forEach(function (t) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'book-settings-tile';
          // t.label may itself be a function for a dynamic-label tile
          // (see below) — the initial title here is only a starting
          // point regardless, overwritten by the real label on the
          // very first sync() pass that always runs right after this
          // loop builds every tile.
          btn.title = (typeof t.label === 'function' ? t.label(false) : t.label) + (t.note ? ' ' + t.note : '');
          // t.icon as a function (icon(isActive) -> icon class), not
          // just a static string, is what lets a tile's own glyph
          // swap between two states on click — the indentation tile
          // specifically, on request, showing a visibly different
          // icon shape for "indented" vs. "flush" rather than the
          // same fixed glyph with only its .active highlight moving.
          // Static t.icon strings (every other tile) still work
          // unchanged: iconSlot just renders the same class every
          // sync in that case.
          var iconSlot = null;
          // nodeSlot: a wrapping span, not t.node appended directly —
          // t.node as a FUNCTION (like config.node in addIconToggle,
          // below) needs somewhere to rebuild fresh into on every
          // sync, the same reason the indentation parglyph originally
          // needed addIconToggle instead of this function at all (§
          // this file's own comment, "Indentation / Paragraph Spacing
          // / Alignment"). A static t.node (an already-built element,
          // no re-render ever needed) still works unchanged — just
          // appended once into the same slot and left alone.
          var nodeSlot = null;
          if (t.icon) {
            iconSlot = document.createElement('i');
            iconSlot.setAttribute('aria-hidden', 'true');
            btn.appendChild(iconSlot);
          } else if (t.glyph) {
            var g = document.createElement('span');
            g.className = 'book-settings-tile-glyph';
            if (t.glyphSize) g.style.fontSize = t.glyphSize;
            if (t.glyphFont) g.style.fontFamily = t.glyphFont;
            g.textContent = t.glyph;
            g.setAttribute('aria-hidden', 'true');
            btn.appendChild(g);

            nodeSlot = document.createElement('span');
            nodeSlot.setAttribute('aria-hidden', 'true');
            if (typeof t.node === 'function') {
              nodeSlot.appendChild(t.node(false));
            } else {
              nodeSlot.appendChild(t.node);
            }
            btn.appendChild(nodeSlot);
          }
          var lab = document.createElement('span');
          lab.className = 'book-settings-tile-label';
          btn.appendChild(lab);
          if (t.disabled) {
            btn.classList.add('disabled');
            btn.disabled = true;
            if (iconSlot) iconSlot.className = 'bi ' + (typeof t.icon === 'function' ? t.icon(false) : t.icon);
            lab.textContent = typeof t.label === 'function' ? t.label(false) : t.label;
          } else {
            btn.addEventListener('click', function (e) {
              e.preventDefault();
              t.onClick();
              syncFns.forEach(function (fn) { fn(); });
            });
            syncFns.push(function () {
              var on = t.isActive();
              btn.classList.toggle('active', on);
              if (iconSlot) iconSlot.className = 'bi ' + (typeof t.icon === 'function' ? t.icon(on) : t.icon);
              if (nodeSlot && typeof t.node === 'function') {
                nodeSlot.innerHTML = '';
                nodeSlot.appendChild(t.node(on));
              }
              var text = typeof t.label === 'function' ? t.label(on) : t.label;
              lab.textContent = text;
              btn.title = text + (t.note ? ' ' + t.note : '');
            });
          }
          row.appendChild(btn);
        });
        li.appendChild(row);
        menu.appendChild(li);
      };
      // One button, not two, for a plain on/off choice (Indentation/
      // Spacing/Alignment used to render both states as separate
      // tiles side by side) — a reader kept clicking whichever tile
      // was already active expecting it to flip the setting, so a
      // second same-shaped tile sitting right next to it read as
      // "another option" rather than "the same switch." A single
      // tile whose own icon/label swap to reflect the state a click
      // just produced (config.icon/node/label are all functions of
      // the current isOn(), re-run on every sync — not just once at
      // build time) makes the one button double as its own status
      // display, closer to a play/pause button than a radio group.
      var addIconToggle = function (label, config) {
        var li = document.createElement('li');
        li.className = 'book-settings-tile-group';
        var labelEl = document.createElement('span');
        labelEl.className = 'book-settings-tile-group-label';
        labelEl.textContent = label;
        li.appendChild(labelEl);
        var row = document.createElement('div');
        row.className = 'book-settings-tile-row';
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'book-settings-tile';
        var iconSlot = document.createElement('span');
        iconSlot.style.display = 'inline-flex';
        iconSlot.style.alignItems = 'center';
        iconSlot.style.justifyContent = 'center';
        btn.appendChild(iconSlot);
        var lab = document.createElement('span');
        lab.className = 'book-settings-tile-label';
        btn.appendChild(lab);
        btn.addEventListener('click', function (e) {
          e.preventDefault();
          config.onClick();
          syncFns.forEach(function (fn) { fn(); });
        });
        row.appendChild(btn);
        li.appendChild(row);
        menu.appendChild(li);
        syncFns.push(function () {
          var on = config.isOn();
          iconSlot.innerHTML = '';
          if (config.node) {
            var node = config.node(on);
            node.setAttribute('aria-hidden', 'true');
            iconSlot.appendChild(node);
          } else if (config.icon) {
            var i = document.createElement('i');
            i.className = 'bi ' + config.icon(on);
            i.setAttribute('aria-hidden', 'true');
            iconSlot.appendChild(i);
          }
          var text = config.label(on);
          lab.textContent = text;
          btn.title = text;
        });
      };
      // A single on/off choice styled with the same tile
      // language as addTileGroup, but as one full-width row
      // with its label as ordinary text beside the tile — a
      // whole grid would read strangely for just one choice
      // (Dim margin).
      var addToggleTile = function (icon, label, onClick, isActive) {
        var li = document.createElement('li');
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'book-settings-tile-toggle-row';
        var tile = document.createElement('span');
        tile.className = 'book-settings-tile';
        var i = document.createElement('i');

      // deleted — same "hide, don't remove" approach as
      // nativeColorToggle above) until a later pass, once they've
      // picked which of the drafted themes to actually keep. In its
      // place, one plain icon in the same row that only ever
      // switches between Procyon Light and Procyon Dark — reusing
      // applyTheme/getCurrentTheme (both already defined above for
      // the full menu) rather than a second, parallel persistence
      // mechanism. display: none, not removed from the DOM — every
      // option this menu already built (all 19 themes) is still
      // fully live and re-enabling it later is just deleting this
      // one line.
      // Set aside again for the initial release — "I'm only going to
      // be releasing it with the dark and light mode" ahead of an
      // upcoming build. Same one-line re-enable as before.
      paletteMenu.wrap.style.display = 'none';
      var lightDarkToggle = document.createElement('a');
      lightDarkToggle.href = '';
      lightDarkToggle.className = 'quarto-navigation-tool px-1 book-light-dark-toggle';
      lightDarkToggle.setAttribute('role', 'button');
      var lightDarkIcon = document.createElement('i');
      lightDarkToggle.appendChild(lightDarkIcon);
      // Icon swaps to name the CURRENT mode (sun while light,
      // moon while dark) rather than the action a click would
      // take — matches the same "state, not verb" convention the
      // dark-mode toggle it replaces already used. Checked against
      // getCurrentTheme() === 'procyon-dark' specifically, not the
      // bare body.quarto-dark class: some other dark-polarity
      // theme could still be active in localStorage from before
      // this change (Cosmos, Twilight, etc.) — quarto-dark would
      // be set for any of those too, but this toggle only ever
      // wants to reflect/land on the two Procyon variants.
      var syncLightDarkToggle = function () {
        var isDark = getCurrentTheme() === 'procyon-dark';
        // bi-moon-fill, not bi-moon-stars-fill — a reader felt the
        // moon+stars glyph's own extra ink (two small stars beside
        // the crescent) made this icon read as visibly bigger/
        // heavier than its neighbors even at the same font-size;
        // a plain crescent is simpler and lighter, closer in
        // visual weight to bi-sun-fill on the other side of this
        // same toggle.
        lightDarkIcon.className = 'bi ' + (isDark ? 'bi-moon-fill' : 'bi-sun-fill');
        // Plain "Dark/Light" — a reader wanted this to describe what
        // the control IS, same as its neighbors ("Font," "Layout,"
        // "Margin Notes" all name the thing, not the click action),
        // not what clicking it does. Static text, not swapped with
        // the icon like the old "Switch to light/dark mode" was —
        // the icon alone already shows the current state.
        lightDarkToggle.title = 'Dark/Light';
      };
      lightDarkToggle.addEventListener('click', function (e) {
        e.preventDefault();
        var isDark = getCurrentTheme() === 'procyon-dark';
        applyTheme(isDark ? 'procyon-light' : 'procyon-dark');
        syncLightDarkToggle();
        lightDarkToggle.blur();
      });
      syncLightDarkToggle();
      tools.appendChild(lightDarkToggle);
    })();
  })();

  // ── Margin quick-toggles ─────────────────────────────────────────────
  // Dim margin (Focus mode, its own independent on/off) plus the
  // three-way Page Contents / Gloss / Footnotes chooser (bookSetRailMode,
  // declared near bookExclusiveToggles above) — on request: Page
  // Contents sits immediately next to Dim margin, then Gloss, then
  // Footnotes, and clicking any one of the three switches the right
  // rail to it and away from whichever of the other two was showing.
  // Runs after the Font/Layout/Palette dropdowns above so
  // document.querySelector below actually finds one — inserting each
  // button immediately before it keeps this whole row leftmost.
  (function () {
    var tools = marginToolsHome;
    if (!tools) return;
    var settingsMenu = document.querySelector('.book-settings-dropdown');

    var setExclusive = function (key, on) {
      var t = bookExclusiveToggles[key];
      if (!t) return;
      document.documentElement.classList.toggle(t.className, on);
      localStorage.setItem(t.storageKey, on.toString());
      t.sync();
      if (on) bookEnforceExclusive(key);
    };
    var isExclusiveOn = function (key) {
      return document.documentElement.classList.contains((bookExclusiveToggles[key] || {}).className || '');
    };

    // One fixed icon per button (styles/custom.css lights it up
    // gold via [aria-pressed] rather than swapping glyphs) — the
    // same on/off-switch language .book-quick-toggle already
    // established.
    var addQuickToggle = function (icon, title, onClick, isActive) {
      var btn = document.createElement('a');
      btn.href = '';
      btn.className = 'quarto-navigation-tool px-1 book-quick-toggle';
      btn.setAttribute('role', 'button');
      btn.title = title;
      // Raw SVG markup (starts with "<svg"), not a bi-* glyph name — used
      // by Compact mode's own icon (below), which needs a shape distinct
      // per aria-pressed state (fading a specific bar in/out via CSS) that
      // no single Bootstrap Icons glyph draws. Every other caller still
      // passes a plain "bi-*" string and gets the original <i> element.
      if (icon.indexOf('<svg') === 0) {
        btn.insertAdjacentHTML('afterbegin', icon);
      } else {
        var iconEl = document.createElement('i');
        iconEl.className = 'bi ' + icon;
        btn.appendChild(iconEl);
      }
      var sync = function () {
        btn.setAttribute('aria-pressed', isActive() ? 'true' : 'false');
      };
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        onClick();
        sync();
        // Blur after handling: this button (Dim margin) lives
        // inside #quarto-margin-sidebar, and styles/custom.css's
        // own html.book-focus-mode #quarto-margin-sidebar:
        // focus-within rule deliberately keeps a sidebar at full
        // opacity while focus is inside it — meant so the rail
        // doesn't dim out from under you while you're actively
        // using it. Without this, clicking the toggle itself
        // left it focused, so :focus-within kept the right
        // sidebar exempt from the very dimming its own click
        // just turned on — confirmed live as the actual reason
        // only the left sidebar visibly dimmed. The left sidebar
        // has no toggle inside it, so it never hit this.
        btn.blur();
      });
      sync();
      if (settingsMenu) {
        tools.insertBefore(btn, settingsMenu);
      } else {
        tools.appendChild(btn);
      }
      return btn;
    };

    // Focus mode's own toggle button (bi-eye, "Dim margin (focus
    // mode)" → "Focus mode") removed on request: "I don't want the
    // dimmer button anymore." setExclusive/isExclusiveOn stay — the
    // 'focus' entry in bookExclusiveToggles and its underlying CSS
    // still exist, just unreachable from the UI now that this was its
    // only trigger.

    // Page Contents / Notes — a two-way exclusive group (bookSetRailMode,
    // declared near bookExclusiveToggles above): exactly one occupies
    // the right rail at a time. Used to be a three-way group (Page
    // Contents / Gloss / Footnotes, each its own button) — merged Gloss
    // and Footnotes into one "Notes" mode on request: a reader wanted
    // both margin-note types reachable with one click instead of
    // switching back and forth between them, at the cost of the two
    // note types now sharing the rail at once rather than each getting
    // its own quiet, uncluttered view. How to visually tell the two
    // note types apart within that shared view is still an open
    // question — deliberately left alone here for now rather than
    // guessed at; the CSS-level distinction (.book-annotation-note-box
    // vs. .book-footnote-margin, styles/custom.css) is exactly where
    // that gets decided once there's a live merged page to look at.
    // Internal rail-mode value is 'notes' (bookRailMode,
    // data-book-rail-mode="notes") — the two prior values ('gloss',
    // 'footnotes') are gone, not aliased; see BOOK_RAIL_MODE_KEY above.
    //
    // "Page Contents" (was "Table of Contents") renamed on request to
    // describe what it shows rather than the mechanism behind it.
    //
    // Was built conditionally — Notes only appearing on pages with
    // actual margin-note content, Page Contents only appearing when
    // there was something else to switch away from — on the reasoning
    // that a button with nothing to switch to/from is clutter. Reader
    // reversed that on request: "every page [needs] the margin notes
    // versus table of contents switch... that feature doesn't
    // disappear just because it switches to a different page." Always
    // built now, including on site/ chrome pages with no margin-note
    // content of their own (Table of Contents, License, ...) — a
    // permanent fixture rather than a page-dependent one.
    //
    // Built before Layout (below) now — on request, this pair should sit
    // to Layout's left rather than after it.
    var contentsBtn, notesBtn;
    var syncRailButtons = function () {
      if (contentsBtn) contentsBtn.setAttribute('aria-pressed', (bookRailMode === 'contents').toString());
      if (notesBtn) notesBtn.setAttribute('aria-pressed', (bookRailMode === 'notes').toString());
    };
    var chooseRailMode = function (mode) {
      bookSetRailMode(mode);
      syncRailButtons();
    };
    // "Chapter Contents" — was "Page Contents." A reader wanted this
    // tooltip to say something closer to "navigation menu, chapter
    // menu, something like that"; reusing "Chapter Contents" matches
    // the exact wording the rail's own heading already shows on a
    // real chapter page (syncTocTitle, above) rather than introducing
    // a third term for the same thing.
    contentsBtn = addQuickToggle(
      'bi-list-ul',
      'Chapter Contents',
      function () { chooseRailMode('contents'); },
      function () { return bookRailMode === 'contents'; }
    );
    // bi-stickies (plural glyph) — was bi-sticky (Gloss's own icon)
    // when this was still a single-purpose button; the plural form
    // reads more like "notes, collectively" now that this one button
    // covers both margin-note types.
    notesBtn = addQuickToggle(
      'bi-stickies',
      'Margin Notes',
      function () { chooseRailMode('notes'); },
      function () { return bookRailMode === 'notes'; }
    );

    // Study mode — a plain independent boolean (own class + localStorage
    // key, pre-paint sentinel in book-head-includes.html), not part of
    // bookExclusiveToggles (doesn't conflict with Focus mode) or the
    // rail-mode group. Manual opt-in: applies the same left-sidebar
    // crunch Compact mode also applies automatically at Stage 2 width
    // (html.book-compact-mode, set in the "floating nav" IIFE below and
    // in book-head-includes.html's pre-paint sentinel), plus dims (not
    // hides — a reader wanted every navbar link to stay reachable, just
    // visually de-emphasized) Home/In Plain Terms/Author's Notes/
    // Contribute — the one piece that's manual-only. See styles/
    // custom.css §COMPACT MODE / §STUDY MODE. Labeled "Layout" in the
    // UI (was "Compact," then "Study mode" before that) — a reader's
    // own words: "that should... say layout" once "it changes from
    // compact to expanded," reading as a description of the whole
    // toggle rather than just its one crunched state. Now built AFTER
    // the Page Contents/Notes pair (above) — on request, Chapter
    // Contents should sit to Layout's left.
    // Internal names (class, localStorage key, comments throughout this
    // file and custom.css) stay "book-study-mode" for now, a cosmetic
    // label change only.
    //
    // Custom SVG icon (not a bi-* glyph): three bars — sidebar, reading
    // column, margin — standing in for the three-rail layout this button
    // crunches. A reader asked for the icon itself to show what it does:
    // "when you toggle it to the compact version, it just has the
    // rectangle [column] or the line [margin] to the right of it" — i.e.
    // the sidebar bar should visually disappear once compact is on,
    // leaving column + margin. Styled as one static icon, not two swapped
    // glyphs: styles/custom.css fades .book-compact-icon-sidebar via
    // [aria-pressed="true"], the same state attribute sync() below
    // already sets — matching how every other quick-toggle here signals
    // its own state (color, not glyph-swapping).
    var COMPACT_ICON_SVG = '<svg class="book-compact-icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
      '<rect class="book-compact-icon-sidebar" x="1" y="3" width="2" height="10" rx="0.5"></rect>' +
      '<rect x="5" y="3" width="6" height="10" rx="0.5"></rect>' +
      '<rect x="13" y="3" width="2" height="10" rx="0.5"></rect>' +
      '</svg>';
    var studyBtn = addQuickToggle(COMPACT_ICON_SVG, 'Layout', function () {
      var on = !document.documentElement.classList.contains('book-study-mode');
      document.documentElement.classList.toggle('book-study-mode', on);
      localStorage.setItem('book-study-mode', on.toString());
      // Taking the sidebar off-canvas moves the reading column's own
      // left edge (styles/custom.css §COMPACT MODE), but --book-navbar-
      // bar-left is only ever re-measured by the resize/font-load
      // listeners further down this script (setBarBounds, inside the
      // "floating nav" IIFE) — a plain class toggle doesn't fire
      // either. A synthetic resize event reuses that exact listener
      // instead of duplicating its measurement logic here.
      window.dispatchEvent(new Event('resize'));
    }, function () { return document.documentElement.classList.contains('book-study-mode'); });

  })();

  // ── Floating sidebar toggles (800–1337.98px gap) ────────────────────
  // Between 1338px (where the docked side rails disappear) and
  // 799.98px (where .quarto-secondary-nav — the hamburger/
  // breadcrumb/search bar — takes over), there's no on-screen way
  // to reach either rail at all: the docked view is gone, and the
  // bar that would normally carry their toggle buttons hasn't
  // appeared yet. Showing that whole bar early was the previous
  // attempt at fixing this — but its own height pushes page
  // content down (styles/custom.css adds top padding to clear
  // it), which reads as its own unprompted layout jump. Putting
  // the two buttons in the main navbar's own tools row instead
  // (a second attempt) avoided that jump but put them in the
  // wrong place — not where a reader would expect sidebar
  // controls to live.
  //
  // This version: two buttons, position:fixed, standing in
  // exactly where .quarto-secondary-nav's own toggle buttons
  // would sit (same top offset, same left/right edges) — so
  // visually they read as "that bar's buttons, without the bar"
  // — but position:fixed takes them out of document flow
  // entirely, the same way the mobile margin-sidebar drawer
  // itself already works (styles/custom.css §21): nothing about
  // the page's height or padding changes when they appear, since
  // there's no box reserving space for them, just two icons
  // floating over the dark chrome that's already there at these
  // widths. Left one re-dispatches a click on the real
  // sidebar-toggle button (.quarto-secondary-nav's own, wired to
  // Bootstrap's collapse plugin) rather than reimplementing that
  // logic here; right one flips the same body class the mobile
  // margin-sidebar drawer already reads. CSS gates both to
  // exactly the 800–1199.98px range this gap covers — hidden
  // above it (rails are docked, unneeded) and below it
  // (.quarto-secondary-nav has its own copies by then).
  (function () {
    var header = document.getElementById('quarto-header');
    if (!header) return;

    var sidebarBtn = document.createElement('a');
    sidebarBtn.href = '';
    sidebarBtn.className = 'book-floating-sidebar-toggle';
    sidebarBtn.setAttribute('role', 'button');
    sidebarBtn.title = 'Table of contents';
    sidebarBtn.innerHTML = '<i class="bi bi-layout-text-sidebar-reverse"></i>';
    sidebarBtn.addEventListener('click', function (e) {
      e.preventDefault();
      var real = document.querySelector('.quarto-secondary-nav .quarto-btn-toggle');
      if (real) real.click();
    });

    // document.body, not header: matching .book-running-head's own
    // treatment just below and for the exact same reason (its comment
    // there has the full history) — this icon needs to slide in
    // lockstep with the running head via the same top-swap technique
    // when #quarto-header hides on scroll, and a position:fixed
    // descendant of #quarto-header can't do that reliably once that
    // header is transformed (confirmed live: before this change, the
    // icons only ever rode #quarto-header's own -52px shift, while the
    // running head's independent top:0 went the rest of the way to the
    // true top — a ~10px mismatch that read as "icons not centered in
    // the bar" once scrolled).
    document.body.appendChild(sidebarBtn);

    // Short front-matter pages (Preface, Introduction, Copyright — no
    // ## headings of their own) never get a nav.toc-active from Quarto
    // at all — this button used to skip building itself entirely on
    // those pages, on the reasoning that opening a drawer with nothing
    // in it but the Font/Layout/Dim-margin tools row would read as
    // broken. Reverted on request: those tools are global settings
    // (Dim margin, Font, Palette, search), not Page-Contents-specific —
    // a reader wants them reachable on every page, not just ones that
    // happen to have their own chapter TOC: "they need to be persistent
    // across all pages... they're global settings." marginToolsHome
    // (above) already builds that row unconditionally on any page with
    // #quarto-margin-sidebar at all, so the drawer this button opens
    // was never actually empty on a toc-less page, just unreachable at
    // this width — the one thing this gate was protecting against
    // wasn't real by the time this ran.
    // Unlike sidebarBtn above (a real-widget-elsewhere proxy) or the
    // true-mobile drawer toggle (which always has the global tools row
    // even with an empty TOC), this icon's own popup shows nothing BUT
    // nav#TOC's list (its own comment just below), so on a page whose
    // TOC genuinely has no entries — front-matter pages like Preface/
    // Introduction/Copyright, confirmed live via nav#TOC having zero
    // <li> children — clicking it opens a visibly empty floating card
    // with nothing to show, exactly the reported bug ("shows up even
    // on pages/states where there's no right-side menu to open").
    // Gated with an if-block, not an early return: runningHead below
    // needs to keep building regardless of whether this icon does.
    // Server-rendered, not JS-populated, so this check is safe to run
    // synchronously here with no race against Quarto's own TOC build.
    var tocForMarginBtn = document.getElementById('TOC');
    if (tocForMarginBtn && tocForMarginBtn.querySelector('li')) {
      var marginBtn = document.createElement('a');
      marginBtn.href = '';
      marginBtn.className = 'book-floating-margin-toggle';
      marginBtn.setAttribute('role', 'button');
      marginBtn.title = 'Page contents';
      marginBtn.innerHTML = '<i class="bi bi-layout-text-sidebar-reverse"></i>';
      // Used to drive its own independent "peek" class (book-page-
      // contents-peek-open) — a reader wanted this icon to bring the
      // right rail out as a true edge-sliding drawer instead, "similar
      // to the mobile thing," the same request .book-floating-sidebar-
      // toggle's own left-side conversion already answers by proxying
      // to the real sidebar-toggle button rather than maintaining a
      // parallel show/hide mechanism. Mirrored here: .mobile-margin-
      // toggle (built further below, true-mobile's own right-drawer
      // button) already opens/closes #quarto-margin-sidebar via
      // body.mobile-margin-open, with its own complete outside-click/
      // scroll/resize dismissal already wired up (§ "Both drawers:
      // close on outside click," further below — built "regardless of
      // whether a visible backdrop happens to be present... at the
      // 800–1199.98px range specifically," i.e. already meant to reach
      // this exact width). Proxying to it here, the same "real widget
      // elsewhere, clone triggers it" split every other icon in this
      // file already uses, means this button needs no dismissal logic
      // of its own at all — one real drawer, one open/close mechanism,
      // reached from two different buttons depending on width instead
      // of two independent systems for the same rail.
      marginBtn.addEventListener('click', function (e) {
        e.preventDefault();
        var realToggle = document.querySelector('.mobile-margin-toggle');
        if (realToggle) realToggle.click();
      });
      // Same reasoning as sidebarBtn's own comment above.
      document.body.appendChild(marginBtn);
    }

    // Running head: shows the same "current chapter/section" text as
    // .mobile-current-section (below), but for the 800-1337.98px range
    // (both Compact sub-phases + the gap above true mobile) — Full
    // stage's docked left sidebar already gives this context, and true
    // mobile has its own copy via .quarto-secondary-nav. Sits on the
    // same fixed row as the two floating icons above (styles/
    // custom.css positions it edge-to-edge with them via the same
    // --book-navbar-bar-left/-width custom properties), rather than
