    // being a second, separately-tracked bar. Appended to document.body,
    // NOT header, deliberately: #quarto-header is headroom.js's own
    // translateY target (styles/custom.css §24's own comment has the
    // full history) — a transform on an element makes it the containing
    // block for any position:fixed descendant, which would trap this
    // element's fixed positioning to the header's own moving box
    // instead of the true viewport. The two floating icons already live
    // inside #quarto-header and get away with it only because their own
    // top/left/right values happen to coincide with the true viewport
    // while pinned (zero-offset transform) — this element additionally
    // needs its own independent top-swap slide animation (styles/
    // custom.css) that has to resolve against the real viewport at
    // every scroll position, not just at rest, so it can't share that
    // coincidence. Staying a body-level sibling of #quarto-header (DOM
    // order still after it, so the ~ sibling selector in custom.css
    // reaches it) sidesteps the trap entirely rather than trying to
    // detach #quarto-header's own transform (tried, reverted — moving
    // that transform onto .navbar instead visibly broke the navbar's
    // own internal layout on every headroom toggle).
    var runningHead = document.createElement('span');
    runningHead.className = 'book-running-head';
    document.body.appendChild(runningHead);
  })();

  var hiddenHrefSuffixes = [
    '/front-home.html',
    '/front-copyright.html',
    '/modal-logic-primer.html',
    '/formal-proof-summary.html',
    '/derivation-map.html',
    '/empirical-predictions.html',
    '/authors-notes.html',
    '/in-plain-terms.html',
    '/for-ai-assistants.html',
    '/style-preview.html',
    '/subject-index.html',
    '/bibliography.html',
    '/glossary.html',
    '/notes.html',
    '/symbols.html',
    '/contact.html',
    '/support.html'
  ];
  // Tracks whether the current page has a visible (non-hidden)
  // entry of its own in this left-hand chapter spine. Pages
  // reached only through the navbar (Appendices, References,
  // Resources, Author's Notes, In Plain Terms) and the home page
  // itself never do — see the "Table of Contents" gold-highlight
  // rule below, which uses this to signal "you're off the main
  // spine, click here to get back to it."
  var hasVisibleActiveChapter = false;
  var items = document.querySelectorAll('#quarto-sidebar li.sidebar-item');
  for (var i = 0; i < items.length; i++) {
    var li = items[i];
    var link = li.querySelector('div.sidebar-item-container > a.sidebar-item-text');
    if (!link) continue;
    var href = link.getAttribute('href');
    // Home page (index.qmd): some client-side script canonicalizes
    // its href down to a bare trailing "/" (verified by dumping the
    // DOM post-script-execution) instead of leaving "...index.html"
    // intact, so a plain "/index.html" suffix check doesn't catch
    // it. No other page on this site renders a bare trailing-slash
    // href, so matching on that is safe and doesn't also catch
    // book/09-50-index.html, the subject index.
    // Netlify's pretty-URL post-processing strips ".html" from every
    // internal href it serves (confirmed: /acknowledgments, not
    // /acknowledgments.html), so comparing raw hrefs against the
    // ".html"-suffixed strings below never matched on the live site
    // — every item in the list leaked into the visible sidebar.
    // Stripping ".html" from both sides before comparing makes the
    // match work whether or not that rewriting is in effect (e.g.
    // local `quarto preview`, which does keep ".html").
    var stripHtml = function (s) { return s.replace(/\.html$/, ''); };
    var bareHref = href ? stripHtml(href) : href;
    var isHome = !!href && (href === 'index.html' || href.endsWith('/') || href.endsWith('/index.html'));
    if (!href && li.className.indexOf('sidebar-item-section') !== -1) {
      var menuText = li.querySelector('.menu-text');
      var secName = menuText ? menuText.textContent.trim() : '';
      if (secName === 'Resources') li.style.setProperty('display', 'none', 'important');
    } else if (href && (isHome || hiddenHrefSuffixes.some(function (s) { return bareHref.endsWith(stripHtml(s)); }))) {
      // !important so this wins even on the active page's own
      // sidebar item, which Quarto re-asserts visibility on.
      li.style.setProperty('display', 'none', 'important');
    } else if (link.classList.contains('active')) {
      hasVisibleActiveChapter = true;
    }
  }
  if (!hasVisibleActiveChapter) {
    document.body.classList.add('no-active-chapter');
  }

  // Sidebar chapter number/leader/title splitting used to live
  // here inline — moved to resources/sidebar-chapter-numbers.js
  // (loaded as its own <script> below, see include-after-body)
  // since it's the one piece of sidebar behavior that keeps
  // getting hand-tuned and was getting lost inside this much
  // larger script block.

  var leftSidebar = document.getElementById('quarto-sidebar');

  // ── Site title + search: navbar → static left sidebar ────────────
  // A reader wanted the whole left column (title, search, Table of
  // Contents, chapter list) to be one static block that never moves,
  // with the top navbar reduced to just the floating nav-link row
  // (Home/In Plain Terms/Appendices/etc — see the navbar-as-overlay
  // rewrite further below). Physically moving the real elements
  // (not duplicating their text into new ones) so nothing about
  // their own behavior needs reimplementing — the brand link still
  // points home, the search button is still the same live Algolia
  // widget, just re-parented. Runs before the "Table of Contents"
  // label injection below so title/search land above it. Quarto
  // also renders its own (separate, never-initialized) sidebar
  // search slot when sidebar.search: true — that one stays empty
  // (confirmed live: duplicate #quarto-search ids, only the navbar's
  // copy Algolia actually mounts into), so it's removed here rather
  // than left behind as dead, invisible markup.
  if (leftSidebar) {
    var navBrandContainer = document.querySelector('#quarto-header .navbar-brand-container');
    var navSearch = document.querySelector('#quarto-header .type-overlay');
    var deadSidebarSearch = leftSidebar.querySelector('.sidebar-search');
    if (deadSidebarSearch && deadSidebarSearch.parentElement) {
      deadSidebarSearch.parentElement.remove();
    }
    if (navSearch) {
      navSearch.classList.add('book-sidebar-search');
      // Not inserted here — it moves straight into the "Table of
      // Contents" row it now shares (below), instead of sitting
      // above it as its own full-width block.
    }
    if (navBrandContainer) {
      // Mobile keeps a lightweight clone of the brand link in the
      // navbar itself, cloned before the real one gets physically
      // moved into the sidebar below. Below 992px the sidebar is a
      // hidden off-canvas drawer, not an always-visible column —
      // moving the only copy of the site title out of the header
      // left mobile with no title anywhere until a reader opened
      // that drawer (confirmed live: the mobile header showed just
      // the hamburger button, nothing else, and .navbar-container's
      // own children had no brand element left in them at all). A
      // clone, not the real element re-shown via CSS in two
      // places at once — this one skips the font-scaling IIFE
      // below entirely (that logic measures the sidebar search
      // box's own width, meaningless for a compact navbar slot)
      // and is hidden outright at ≥992px (styles/custom.css),
      // where the sidebar's own copy already does this job.
      var mobileBrandClone = navBrandContainer.cloneNode(true);
      mobileBrandClone.removeAttribute('id');
      mobileBrandClone.classList.remove('mx-auto');
      mobileBrandClone.classList.add('book-mobile-brand');
      var navbarToggler = document.querySelector('#quarto-header .navbar-toggler');
      if (navbarToggler && navbarToggler.parentElement) {
        navbarToggler.insertAdjacentElement('afterend', mobileBrandClone);
        // Search, top right of the bar, right after "Resources" —
        // one single entry point, visible at every width (styles/
        // custom.css carries no hide-below/above-X rule for this
        // one, unlike the title clone beside it). Went through a
        // white-secondary-nav-only phase, then a <992px-only
        // phase, before landing here — a reader wanted one icon
        // that "just always stays there... every step of the
        // way," not a different widget per breakpoint. Not a
        // second live widget — proxies a click through to the
        // real Algolia button wherever it currently sits (inside
        // the "Table of Contents" row, see the sidebar title/
        // search relocation above, though that copy is now
        // hidden everywhere in favor of this one).
        var navbarSearchToggle = document.createElement('button');
        navbarSearchToggle.type = 'button';
        navbarSearchToggle.className = 'btn book-navbar-search-toggle';
        navbarSearchToggle.setAttribute('aria-label', 'Search');
        navbarSearchToggle.innerHTML = '<i class="bi bi-search"></i>';
        navbarSearchToggle.addEventListener('click', function () {
          var realSearchBtn = document.querySelector('#quarto-search .aa-DetachedSearchButton');
          if (realSearchBtn) realSearchBtn.click();
        });
        // .quarto-navbar-tools is Quarto's own already-correctly-
        // positioned right-edge slot in this bar (space-between
        // on the row lands it flush right, immediately after the
        // nav-link list ending in "Resources" — confirmed live)
        // — the search widget's original home before it moved
        // into the sidebar, still there and still empty except
        // for a hidden color-scheme toggle this book doesn't use.
        var navbarTools = document.querySelector('#quarto-header .quarto-navbar-tools');
        if (navbarTools) {
          navbarTools.appendChild(navbarSearchToggle);
        } else {
          navbarToggler.parentElement.appendChild(navbarSearchToggle);
        }

        // Font and Dark/Light need the exact same treatment as Search
        // just above: the real controls (.book-settings-dropdown,
        // .book-light-dark-toggle) live inside marginToolsHome, a
        // genuine DOM child of #quarto-margin-sidebar — so they're
        // only ever as visible/positioned as that drawer's own open/
        // closed state, and a reader hit them vanishing outright while
        // the drawer was open (an ancestor overflow:auto, needed for
        // the drawer's real scrolling content, clips their own
        // position:fixed paint the moment it applies — the same
        // clipping bug this file's own true-mobile block already
        // fixed once for the closed state specifically, just not the
        // open one). Same fix as Search: independent clones here,
        // proxying a click through to the real controls rather than
        // reimplementing them. A click still fires on an ancestor-
        // clipped element (clipping only ever affects paint, not
        // hit-testing or layout geometry), so these proxies work
        // regardless of whether the real element they target is
        // currently visible.
        var navbarFontToggle = document.createElement('button');
        navbarFontToggle.type = 'button';
        navbarFontToggle.className = 'btn book-navbar-font-toggle';
        navbarFontToggle.setAttribute('aria-label', 'Font');
        navbarFontToggle.innerHTML = '<i class="bi bi-type"></i>';
        navbarFontToggle.addEventListener('click', function (e) {
          e.preventDefault();
          var realToggle = document.querySelector('.book-settings-dropdown .dropdown-toggle[title="Font"]');
          if (!realToggle) return;
          // realToggle.click() (matching every other proxy in this
          // file) doesn't reliably reach Bootstrap's own delegated
          // dropdown listener here, so this drives the same Dropdown
          // instance's own API directly instead — confirmed live that
          // works, EXCEPT called synchronously within this same click
          // handler it closed again immediately: Bootstrap's show()
          // attaches its own "click outside closes this" listener on
          // document as part of opening, and since this click event is
          // still bubbling (navbarFontToggle -> ... -> document) when
          // that listener gets attached, the same in-flight event
          // reaches document afterward, reads navbarFontToggle as
          // "outside" the dropdown, and closes what this line just
          // opened — all inside one event dispatch, confirmed live via
          // aria-expanded reading "false" immediately after, every
          // time. Deferring to the next tick lets this event finish
          // bubbling first, so Bootstrap's own listener is only ever
          // watching for the NEXT click, not this one.
          if (window.bootstrap && window.bootstrap.Dropdown) {
            var instance = window.bootstrap.Dropdown.getOrCreateInstance(realToggle);
            // A second click, meant to close an already-open menu, hits the
            // exact same in-flight-bubble race described above in reverse:
            // Bootstrap's own "click outside" listener (attached when this
            // dropdown opened) sees this click too, reads navbarFontToggle
            // as outside the dropdown, and closes it synchronously as part
            // of THIS bubble — then the deferred toggle() below would fire
            // on the next tick against an already-closed dropdown and
            // reopen it, so the menu never visibly closes. Reading
            // aria-expanded now, before any of that runs, and branching to
            // an immediate hide() (no race — closing doesn't attach a new
            // listener that could undo itself) sidesteps it; opening still
            // needs the same tick-deferred show() as before.
            if (realToggle.getAttribute('aria-expanded') === 'true') {
              instance.hide();
            } else {
              setTimeout(function () { instance.show(); }, 0);
            }
          } else {
            realToggle.click();
          }
        });
        navbarTools.appendChild(navbarFontToggle);

        // Icon mirrors the real toggle's own sun/moon swap (its own
        // syncLightDarkToggle, above) rather than a fixed glyph —
        // otherwise this clone would read as permanently "switch to
        // dark" even after the reader had already switched.
        var navbarDarkLightToggle = document.createElement('button');
        navbarDarkLightToggle.type = 'button';
        navbarDarkLightToggle.className = 'btn book-navbar-dark-light-toggle';
        navbarDarkLightToggle.innerHTML = '<i class="bi"></i>';
        var syncNavbarDarkLightToggle = function () {
          // Reads the real toggle's own current icon rather than
          // calling getCurrentTheme() directly — that helper is scoped
          // inside the Font/Layout/Palette IIFE above, already closed
          // by this point in the script, and out of reach here.
          var realIcon = document.querySelector('.book-light-dark-toggle i.bi');
          var isDark = !!realIcon && realIcon.classList.contains('bi-moon-fill');
          navbarDarkLightToggle.querySelector('i').className = 'bi ' + (isDark ? 'bi-moon-fill' : 'bi-sun-fill');
          // Matches the real toggle's own static "Dark/Light" label
          // (above) — describes the control, not the click action.
          navbarDarkLightToggle.setAttribute('aria-label', 'Dark/Light');
        };
        navbarDarkLightToggle.addEventListener('click', function () {
          var realToggle = document.querySelector('.book-light-dark-toggle');
          if (realToggle) realToggle.click();
          syncNavbarDarkLightToggle();
        });
        syncNavbarDarkLightToggle();
        navbarTools.appendChild(navbarDarkLightToggle);
      }

      navBrandContainer.classList.add('book-sidebar-title');
      // Bootstrap's own mx-auto utility (margin-left/-right: auto
      // !important) came along from this element's original navbar
      // context and silently beat the title-font-scaling IIFE's
      // own margin-left: var(--book-sidebar-left-nudge) below —
      // confirmed live: the custom property itself was set
      // correctly, but the element's actual computed margin-left
      // never matched it. Not needed here regardless — centering
      // within a horizontal navbar bar doesn't mean anything once
      // this is a full-width block in a vertical sidebar column.
      navBrandContainer.classList.remove('mx-auto');
      leftSidebar.insertBefore(navBrandContainer, leftSidebar.firstChild);
    }
  }

  // Mirror the magnifying glass into the right rail's icon row too
  // (≥1200px docked view), at the far right — appended last, not
  // inserted before marginToolsHome's first child anymore. Used to
  // land leftmost that way (inserted before the eye/Dim-margin
  // toggle), but a reader wanted it broken out entirely instead:
  // on its own at the far right, separated from the rest by a
  // real gap rather than sitting flush against the dim/eye
  // toggle at the front of the row (styles/custom.css gives it
  // its own extra margin-left for that separation). A genuinely
  // separate button, not the navbarSearchToggle node moved here:
  // that copy above still needs to cover 800–1199.98px, where
  // this rail is a hidden off-canvas drawer, not an always-
  // visible docked column — styles/custom.css hides the navbar's
  // copy only at ≥1200px, so exactly one is ever visible at a
  // given width, the same "real widget in the docked rail, clone
  // in the navbar for everything narrower" split .book-sidebar-
  // title/.book-mobile-brand already use. Both proxy through to
  // the same real, hidden Algolia button — same click handler as
  // navbarSearchToggle above, just a second node.
  if (marginToolsHome) {
    var marginSearchToggle = document.createElement('a');
    marginSearchToggle.href = '';
    marginSearchToggle.className = 'quarto-navigation-tool px-1 book-margin-search-toggle';
    marginSearchToggle.setAttribute('role', 'button');
    marginSearchToggle.title = 'Search';
    marginSearchToggle.innerHTML = '<i class="bi bi-search"></i>';
    marginSearchToggle.addEventListener('click', function (e) {
      e.preventDefault();
      var realSearchBtn = document.querySelector('#quarto-search .aa-DetachedSearchButton');
      if (realSearchBtn) realSearchBtn.click();
    });
    marginToolsHome.appendChild(marginSearchToggle);
  }

  // Reorder .book-margin-tools' children into the sequence a reader
  // asked for — Layout, Chapter Contents, Margin Notes, Font, Dark/
  // Light, Search, left to right — rather than the order each one
  // happened to get built/appended in above. Every icon already
  // exists in the DOM by this point; appendChild on an existing child
  // moves it to the end of its parent without cloning it, so calling
  // it on each one in the target order, in sequence, leaves the whole
  // row in exactly that order with no separate insertBefore/index
  // bookkeeping needed. Selecting Layout/Chapter Contents/Margin Notes
  // by their own [title] (buildMenu/addQuickToggle both set it, stable
  // across state) and Dark/Light by its class instead — its own title
  // changes with the current mode, so a title-based selector would
  // stop matching depending on which mode was active when this runs.
  (function () {
    if (!marginToolsHome) return;
    var findByTitle = function (title) {
      var el = marginToolsHome.querySelector('[title="' + title + '"]');
      if (!el) return null;
      return el.closest('.book-quick-toggle, .book-settings-dropdown') || el;
    };
    [
      findByTitle('Layout'),
      findByTitle('Chapter Contents'),
      findByTitle('Margin Notes'),
      findByTitle('Font'),
      marginToolsHome.querySelector('.book-light-dark-toggle'),
      marginToolsHome.querySelector('.book-margin-search-toggle'),
    ].forEach(function (el) {
      if (el) marginToolsHome.appendChild(el);
    });
  })();

  // ── Style-preview only: layout-debug outline toggle ──────────────
  // A reader building this page wanted a quick visual check on
  // whether the left/right rails and their inner boxes actually
  // line up the way the numbers say they do, without having to
  // pull up devtools each time — a small button that lights up the
  // boxes this project keeps hand-tuning (both rails, both title/
  // tools rows, both inner list boxes, the reading column) with a
  // red outline on click, toggled back off on a second click.
  // Appended directly to <body>, not into marginToolsHome — this
  // used to live in the icon row up top, but a reader wanted it
  // fully separate from that (a real settings control a reader
  // might click) and pinned instead to its own fixed spot, the
  // far bottom-left corner of the viewport (styles/custom.css
  // gives it position: fixed; bottom: 0; left: 0). Gated to
  // body.style-preview-page only — this is a design-QA tool for
  // the one page built for design QA, and appending it to <body>
  // instead of some page-specific container makes that gate the
  // ONLY thing keeping it off every other page (nothing about a
  // real chapter's own DOM would otherwise exclude it), so it
  // still can't show up anywhere but here.
  if (document.body.classList.contains('style-preview-page')) {
    var debugToggle = document.createElement('button');
    debugToggle.type = 'button';
    debugToggle.className = 'book-debug-toggle';
    debugToggle.title = 'Toggle layout debug outlines';
    debugToggle.innerHTML = '<i class="bi bi-bounding-box"></i>';
    debugToggle.addEventListener('click', function (e) {
      e.preventDefault();
      document.documentElement.classList.toggle('book-debug-outline');
      debugToggle.blur();
    });
    document.body.appendChild(debugToggle);
  }

  // Inject "Table of Contents" label above the chapter list,
  // sharing one row with the search icon (moved out of the navbar
  // above) sitting just to its left — hovering right where the
  // chapter list's own first entry ("P.", Preface) starts below.
  var existingBrand = leftSidebar ? leftSidebar.querySelector('.book-sidebar-brand') : null;
  if (!existingBrand && leftSidebar) {
    var brandEl = document.createElement('a');
    brandEl.className = 'book-sidebar-brand';
    // Links to the actual Table of Contents page (site/table-of-
    // contents.qmd) rather than home — a full chapter/section/
    // subsection listing, not just the home page's chapter list.
    // Full path with ".html": there is no pretty-URL rewriting
    // anywhere in this build (checked netlify.toml/rebuild.js —
    // neither does any URL rewriting), so an extensionless href
    // here 404s both locally and on the live site.
    brandEl.href = '/site/table-of-contents.html';
    brandEl.textContent = 'Table of Contents';
    var tocRow = document.createElement('div');
    tocRow.className = 'book-sidebar-toc-row';
    if (navSearch) tocRow.appendChild(navSearch);
    tocRow.appendChild(brandEl);
    // Compact mode originally put a Home icon in this row too — a
    // reader tried it and didn't like it there, removed. Compact
    // mode's own way back to the home page is the site title itself,
    // relocated into the navbar (.book-mobile-brand, styles/custom.css
    // §COMPACT MODE) rather than anything added to this sidebar row.
    var brandMc = leftSidebar.querySelector('.sidebar-menu-container');
    // Inside .sidebar-menu-container (its first child), not a
    // sibling before it — mirrors the right rail exactly: its own
    // "Chapter Contents" label (#toc-title) lives inside nav#TOC,
    // the same boxed element the list itself scrolls inside, not
    // sitting above that box as a separate row. A reader wanted
    // the two rails structurally identical here, not just
    // matching in color/width (§9's earlier fixes).
    if (brandMc) brandMc.insertBefore(tocRow, brandMc.firstChild);
  }

  // Compact/Study mode's left sidebar: no custom control needed here
  // anymore — both now just mean "the sidebar is off-canvas" (styles/
  // custom.css §COMPACT MODE / STUDY MODE), reusing the existing
  // .book-floating-sidebar-toggle button (built above) and the
  // existing left-drawer open/close mechanism (below) exactly as-is.
  // An earlier version built its own separate hamburger + expand-in-
  // place control here — reverted on request: "I want it to look
  // exactly like that in the exact same spot [the existing floating
  // toggle]... it's already doing the thing anyway."

  // One shared block, one shared padding — title, search, "Table
  // of Contents," and the chapter list all move inside a single
  // new wrapper rather than each carrying its own independently-
  // tuned padding/margin trying to approximate the same left/
  // right edges. Replaces several rounds of JS-measured nudging
  // (matching the chapter list's own rendered edges, correcting
  // for Bootstrap's leftover mx-auto fighting a margin nudge,
  // etc.) with the actual fix: give them nowhere to drift apart
  // from each other in the first place. The chapter list's own
  // internal number-column/dot-leader system still does its own
  // thing *within* this shared box — nothing about that changes,
  // it just now measures its "100%" against this wrapper's
  // content width instead of #quarto-sidebar's directly.
  (function () {
    if (!leftSidebar) return;
    var existingWrap = leftSidebar.querySelector('.book-sidebar-content');
    if (existingWrap) return;
    var wrap = document.createElement('div');
    wrap.className = 'book-sidebar-content';
    // .book-sidebar-toc-row isn't listed separately here anymore
    // — it's already nested inside .sidebar-menu-container (see
    // the "Inject 'Table of Contents' label" block above), so
    // moving .sidebar-menu-container itself carries it along.
    // Listing it here too used to independently re-parent it
    // straight into wrap, undoing that nesting the instant this
    // ran.
    var toMove = ['.book-sidebar-title', '.sidebar-menu-container'];
    toMove.forEach(function (sel) {
      var el = leftSidebar.querySelector(sel);
      if (el) wrap.appendChild(el);
    });
    leftSidebar.appendChild(wrap);
  })();

  // Title font-size scales to exactly fill .book-sidebar-title's
  // own rendered width, on one line, whatever the title text
  // actually says — the "flexible width" behavior this title
  // always had back when it lived in the navbar (a reader
  // specifically remembered and asked for it back after the
  // navbar→sidebar move above), just re-targeted at this column
  // instead of a navbar slot. Used to measure .book-sidebar-toc-
  // row (the search+"Table of Contents" row below the title) back
  // when .book-sidebar-title shared its column's width with that
  // row — a later, unrelated fix pulled .book-sidebar-title out
  // into its own independently fixed-position box (own width:
  // var(--book-sidebar-w), no longer tied to .book-sidebar-
  // content's own padded-inset width), leaving this script still
  // measuring the now-narrower row and scaling the title to fill
  // only that (221px) instead of the title's own actual box
  // (255px) — confirmed live, a ~34px gap of unfilled space sat
  // to the title text's own left inside its box, the same "Table
  // of Contents" fills its row edge-to-edge but the title didn't
  // fill its own comparison a reader made directly. Measuring
  // .book-sidebar-title itself instead is both more correct (it's
  // the box the title is actually meant to fill) and simpler (one
  // less element to look up). Runs after the wrapping IIFE just
  // above (not before it) so even the very first, synchronous
  // call measures each element in its real final position, not
  // wherever it briefly sat before being moved into .book-
  // sidebar-content.
  (function () {
    var titleBox = document.querySelector('.book-sidebar-title');
    var titleEl = titleBox ? titleBox.querySelector('.navbar-brand') : null;
    if (!titleEl || !titleBox) return;
    var setTitleFontSize = function () {
      document.documentElement.style.removeProperty('--book-sidebar-title-font-size');
      // .book-sidebar-title carries its own left/right padding
      // (matching .sidebar-menu-container/nav#TOC) — subtract it
      // so the text fills the padded content area, not the box's
      // full outer width past the padding.
      var titleBoxStyle = getComputedStyle(titleBox);
      var titleBoxPadding = (parseFloat(titleBoxStyle.paddingLeft) || 0) + (parseFloat(titleBoxStyle.paddingRight) || 0);
      var targetWidth = titleBox.getBoundingClientRect().width - titleBoxPadding;
      if (targetWidth <= 0) return;
      var naturalWidth = titleEl.getBoundingClientRect().width;
      if (naturalWidth <= 0) return;
      var baseFontSizePx = parseFloat(getComputedStyle(titleEl).fontSize);
      var scale = targetWidth / naturalWidth;
      document.documentElement.style.setProperty('--book-sidebar-title-font-size', (baseFontSizePx * scale) + 'px');
    };
    setTitleFontSize();
    window.addEventListener('resize', setTitleFontSize);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(setTitleFontSize);
    }
  })();

  var tocTitle = document.getElementById('toc-title');

  // Right sidebar TOC label: a reader wanted this to just say what
  // the page itself is — "1. Groundwork," "Contact," "Home" — rather
  // than a generic "Chapter Contents"/"Page Contents" bucket, since
  // everything the rail lists below it is part of that one page
  // either way. .chapter-title (inside .quarto-page-breadcrumbs) is
  // already exactly that text, computed once per page by Quarto's own
  // breadcrumb — confirmed live across chapter/front-matter/site-chrome
  // pages alike (groundwork.html: "1. Groundwork"; contact.html:
  // "Contact"; index.html: "Home") — reusing it here instead of a
  // second, hand-maintained CHAPTER_SLUGS/page-type bucket list that
  // this file's own home-page/chapter special-casing used to need.
  // Falls back to Quarto's own toc-title default (tocTitle's original
  // textContent, from format.html) on the rare page with no breadcrumb
  // at all. This is the BASE label — computed once from the page
  // itself, independent of which rail mode is active.
  if (tocTitle) {
    var pageTitleEl = document.querySelector('.quarto-page-breadcrumbs .chapter-title');
    var baseTocTitle = pageTitleEl ? pageTitleEl.textContent.trim() : tocTitle.textContent;
    // Overlaid by the active rail mode, so the label itself acts as a
    // standing reminder of what's currently showing in this rail — a
    // reader wanted this: "that way they'll know that the mode is
    // active, and they'll have that constant reminder." Notes mode
    // (merged from the old separate Gloss/Footnotes modes — see
    // chooseRailMode's own header comment) reads as "Notes" here too;
    // still an open question whether the label should say something
    // more specific once there's a live merged page to look at.
    var syncTocTitle = function () {
      // This label describes whatever content the rail is actually
      // showing right now, peek or not — bookRailMode itself is already
      // the right source for that: bookPeekRailMode sets it to
      // 'contents' for the duration of a peek (so the CSS-only Chapter
      // Contents list and this label agree), and restores it before
      // clearing bookRailPeekActive when the peek ends (closeMarginDrawer
      // and marginBtn's own second-click handler both do this via
      // bookPeekRailMode(bookRailPeekRestoreMode)). Reading
      // bookRailPeekRestoreMode here instead — an earlier version of
      // this function did — froze the label on "Margin Notes" for the
      // whole peek while the visible list underneath had already
      // switched to Chapter Contents, confirmed live via screenshot: a
      // "Margin Notes" heading over a plain chapter TOC.
      // Small icon before the text, reusing whichever persistent
      // quick-toggle's own glyph matches the mode currently showing
      // (bi-stickies for Margin Notes, addQuickToggle('bi-stickies',
      // 'Margin Notes', ...) above) — on request, every page's own
      // name in this slot ("1. Groundwork," "Contact," "Home," ...)
      // gets the same treatment too, not just Margin Notes on its
      // own, reusing Chapter Contents' own bi-list-ul
      // (addQuickToggle('bi-list-ul', 'Chapter Contents', ...) above)
      // since that's the toggle a reader actually lands back on for
      // every one of those pages. Built with createElement/
      // appendChild rather than a plain textContent assignment (this
      // label's own original approach) since textContent can't hold
      // an element.
      var setTocTitleWithIcon = function (iconClass, text) {
        tocTitle.innerHTML = '';
        var icon = document.createElement('i');
        icon.className = 'bi ' + iconClass;
        tocTitle.appendChild(icon);
        tocTitle.appendChild(document.createTextNode(' ' + text));
      };
      if (bookRailMode === 'notes') {
        setTocTitleWithIcon('bi-stickies', 'Margin Notes');
      } else {
        // Plain text, no icon — on request, reversed back from the
        // bi-list-ul treatment above: Page Contents doesn't need a
        // standing "mode" reminder icon the way Margin Notes does,
        // since it's just showing the page's own name, not signaling
        // that a special mode is active.
        tocTitle.innerHTML = '';
        tocTitle.appendChild(document.createTextNode(baseTocTitle));
      }
    };
    syncTocTitle();
    bookRailModeTocTitleSync = syncTocTitle;
  }

  // ── TOC: title left, number right ───────────────────────────────
  var tocLinks = document.querySelectorAll('nav#TOC a.nav-link');
  for (var j = 0; j < tocLinks.length; j++) {
    var link = tocLinks[j];
    var text = link.textContent.trim();
    var nm = text.match(/^(\d+(?:\.\d+)*)\s+(.+)$/);
    if (!nm) continue;
    link.textContent = '';
    var titleSpan = document.createElement('span');
    titleSpan.className = 'toc-entry-title';
    titleSpan.textContent = nm[2];
    var numSpan = document.createElement('span');
    numSpan.className = 'toc-entry-num';
    numSpan.textContent = nm[1];
    link.appendChild(titleSpan);
    link.appendChild(numSpan);
  }

  // ── Home page: group boundaries + visual hierarchy ───────────────
  // Detects the numbered/lettered chapter run within the sidebar's
  // full item list (chapters sit between front matter and back
  // matter) by checking for .sidebar-chapter-num — the split
  // resources/sidebar-chapter-numbers.js already produced earlier
  // for every "N. Title" / "P. Title" chapter-title span, on this
  // page exactly as on every other. Was checking .toc-entry-num
  // instead, a class nothing had created anywhere in the left
  // sidebar at the point this ran — the block below used to be
  // the only thing that ever added it there, and only after this
  // one already finished looking, so firstChIdx/lastChIdx always
  // came back -1 and home-chapter-first/-backmatter-first never
  // actually landed on anything. Confirmed live.
  if (document.body.classList.contains('home-page')) {
    var sidebarItems = Array.from((leftSidebar || document).querySelectorAll(
      '#quarto-sidebar .sidebar-item'
    ));
    var firstChIdx = sidebarItems.findIndex(function(li) {
      return !!li.querySelector('.sidebar-chapter-num');
    });
    var lastChIdx = sidebarItems.reduce(function(acc, li, i) {
      return li.querySelector('.sidebar-chapter-num') ? i : acc;
    }, -1);
    if (firstChIdx > -1) sidebarItems[firstChIdx].classList.add('home-chapter-first');
    if (lastChIdx > -1 && lastChIdx + 1 < sidebarItems.length) {
      sidebarItems[lastChIdx + 1].classList.add('home-backmatter-first');
    }
  }

  // ── Home page: wrap un-numbered sidebar links for TOC-style layout
  // resources/sidebar-chapter-numbers.js (loaded earlier) already
  // splits every numbered/lettered chapter-title span — front
  // matter, the numbered chapters, back matter alike — into
  // .sidebar-chapter-num/-leader/-title-text, the same dot-leader
  // structure the regular docked sidebar uses on every other page.
  // This block used to re-derive that same split from
  // cl.textContent instead, which by this point is just that
  // split's own children concatenated back together with no space
  // between them ("1.Groundwork"), and its own regex only ever
  // matched a leading digit, never the single-letter front/back-
  // matter labels (P./I./C./E.) — so every lettered entry lost its
  // label entirely and every numbered one lost the space right
  // after it. Confirmed live. Skipping anything
  // sidebar-chapter-numbers.js already split leaves its correct
  // output alone; the only real work left here is wrapping the
  // handful of links that were never numbered at all (Home,
  // Contribute, the Resources group header, …) in .toc-entry-title,
  // which this page's own flex/sizing rules (§ home-page sidebar)
  // still expect on those.
  if (document.body.classList.contains('home-page')) {
    var chapterLinks = document.querySelectorAll(
      '#quarto-sidebar .sidebar-item-container a.sidebar-item-text'
    );
    for (var ci = 0; ci < chapterLinks.length; ci++) {
      var cl = chapterLinks[ci];
      if (cl.querySelector('.sidebar-chapter-num')) continue;
      var ct = cl.textContent.trim();
      cl.textContent = '';
      var ctSpan = document.createElement('span');
      ctSpan.className = 'toc-entry-title';
      ctSpan.textContent = ct;
      cl.appendChild(ctSpan);
    }
  }

  // ── Auto-link page-name references ───────────────────────────────
  // Anywhere "Glossary", "Bibliography", "Notes", "Appendix A" etc.
  // appears as plain text, wrap it in a link to that page. Skips
  // text already inside <a> tags, headings, and the page's own name.
  (function() {
    // No ".html" suffix on any of these — these hrefs are built at
    // runtime in JS, so they never pass through Netlify's build-time
    // pretty-URL rewriting (which only rewrites hrefs baked into the
    // static HTML). Every other link on the live site already
    // resolves to the extensionless form, so these have to match it
    // directly instead of relying on rewriting they never get.
    var PAGE_LINKS = [
      { word: 'Glossary',      url: 'glossary',              skip: 'glossary' },
      { word: 'Bibliography',  url: 'bibliography',          skip: 'bibliography' },
      { word: 'Symbols',       url: 'symbols',               skip: 'symbols' },
      { word: 'Index',         url: 'subject-index',         skip: 'subject-index' },
      { word: 'Appendix A',    url: 'modal-logic-primer',    skip: 'modal-logic-primer' },
      { word: 'Appendix B',    url: 'formal-proof-summary',  skip: 'formal-proof-summary' },
      { word: 'Appendix C',    url: 'derivation-map',        skip: 'derivation-map' },
      { word: 'Appendix D',    url: 'empirical-predictions', skip: 'empirical-predictions' },
    ];
    var path = window.location.pathname;
    var active = PAGE_LINKS.filter(function(p) { return path.indexOf(p.skip) === -1; });
    if (!active.length) return;
    active.sort(function(a, b) { return b.word.length - a.word.length; });
    var pattern = active.map(function(p) {
      return p.word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }).join('|');
    var re = new RegExp('\\b(' + pattern + ')\\b', 'g');
    var content = document.getElementById('quarto-document-content') ||
                  document.querySelector('main.content');
    if (!content) return;
    var walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, null, false);
    var nodes = [], n;
    while ((n = walker.nextNode())) {
      var el = n.parentElement, skip = false;
      while (el && el !== content) {
        var tag = el.tagName;
        if (tag === 'A' || tag === 'H1' || tag === 'H2' || tag === 'H3' ||
            tag === 'SCRIPT' || tag === 'STYLE' || tag === 'NAV') { skip = true; break; }
        el = el.parentElement;
      }
      if (!skip && re.test(n.nodeValue)) nodes.push(n);
      re.lastIndex = 0;
    }
    nodes.forEach(function(textNode) {
      var text = textNode.nodeValue, frag = document.createDocumentFragment(), last = 0, m;
      re.lastIndex = 0;
      while ((m = re.exec(text)) !== null) {
        if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
        var target = active.find(function(p) { return p.word === m[1]; });
        var a = document.createElement('a');
        a.href = '/' + target.url;
        a.textContent = m[1];
        frag.appendChild(a);
        last = m.index + m[1].length;
      }
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      textNode.parentNode.replaceChild(frag, textNode);
    });
  })();

  // ── Mobile: measure the secondary nav's height ────────────────────
  // Read-only: custom.css (§24) pins .quarto-secondary-nav to the
  // viewport via CSS alone now (no DOM moves — an earlier version
  // of this fix re-parented the element via JS, which depended on
  // this script running before anything else could touch it and
  // broke in practice). This just records its real rendered height
  // as a CSS variable so the page content can reserve enough space
  // not to sit underneath it; falls back to a fixed estimate in
  // custom.css if this hasn't run yet.
  (function () {
    var secondaryNav = document.querySelector('.quarto-secondary-nav');
    if (!secondaryNav) return;
    var setSecondaryNavHeight = function () {
      document.documentElement.style.setProperty(
        '--book-secondary-nav-height', secondaryNav.offsetHeight + 'px'
      );
    };
    setSecondaryNavHeight();
    window.addEventListener('resize', setSecondaryNavHeight);
    // Re-measure once Source Serif 4 finishes loading: the initial
    // call above likely runs on the fallback font (see custom.css's
    // metric-matched fallback), which can render this element a
    // few px shorter than its final webfont height, understating
    // how much space body needs to reserve below it.
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(setSecondaryNavHeight);
    }
  })();

  // ── Mobile: measure the navbar's height ───────────────────────────
  // Same reasoning as the secondary-nav measurement above — custom.css
  // previously hardcoded the navbar's height as 52px (measured once,
  // by hand), and the gap between that estimate and its real rendered
  // height was visible as a sliver of page content behind the
  // secondary nav. Measuring it live removes the guesswork. Still
  // relevant below 992px — Bootstrap's own hamburger/collapse mode,
  // untouched by the floating-overlay rewrite just above/below,
  // which only applies once the nav-link row is inline (≥992px).
  (function () {
    var navbar = document.querySelector('#quarto-header .navbar');
    if (!navbar) return;
    var setNavbarHeight = function () {
      document.documentElement.style.setProperty(
        '--book-navbar-height', navbar.offsetHeight + 'px'
      );
    };
    setNavbarHeight();
    window.addEventListener('resize', setNavbarHeight);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(setNavbarHeight);
    }
  })();

  // ── Floating nav bar: width/position + priority collapse ─────────
  // Brand, search, and the Font/Layout/Palette/Dim-margin tools all
  // moved out of the navbar (into the static left/right sidebars —
  // see above/below); all that's left in it now is the nav-link row
  // itself (Home…Resources), which a reader wanted turned into a
  // floating, translucent bar that never reserves layout space and
  // is never wider than the reading column. --book-navbar-bar-left/
  // -width (styles/custom.css §19 consumes these on .navbar itself,
  // which the bar's own translucent background/blur/rounding now
  // lives on directly, not a full-width wrapper) are sized off
  // #quarto-document-content's own rendered rect — the same "don't
  // guess, measure" approach every other alignment var in this file
  // already uses. Unlike the old brand/tools measurement this
  // replaces, there's no docked-sidebar gate here: the reading
  // column's own rect is valid and meaningful regardless of sidebar
  // state, so this can just always run at ≥992px.
  (function () {
    var navbarEl = document.querySelector('#quarto-header .navbar');
    var navLinksRow = document.querySelector('#quarto-header .navbar-collapse > .navbar-nav');
    var navToggler = document.querySelector('#quarto-header .navbar-toggler');
    if (!navbarEl || !navLinksRow || !navToggler) return;

    var setBarBounds = function () {
      // Used to early-return here once the hamburger toggler was
      // visible (below 992px) on the reasoning that "Bootstrap's own
      // collapse takes over — nothing here to measure or constrain":
      // true for the SIDEBARS specifically (below 1200px they switch
      // to off-canvas fixed drawers with their own hardcoded closed-
      // state offsets, never touching --book-navbar-bar-left/-width at
      // all) but not for #quarto-document-content.page-full::before
      // (styles/custom.css), the reading column's own background fill
      // on any page with a margin note — that pseudo reads these same
      // two variables completely unscoped, at every width down to
      // true mobile. Any page loaded directly below 992px (not resized
      // into — a fresh navigation, or Playwright's own viewport-at-
      // launch pattern) hit this return before ever measuring once,
      // leaving both variables frozen at their bare CSS fallbacks
      // (0px / 800px) for the page's entire lifetime: confirmed live
      // as a reader's own report — the reading column's cream fill
      // pinned to the viewport's left edge, overflowing off the right
      // below ~850px, on style-preview.qmd specifically (a page-full
      // page with no real #title-block-header, the combination that
      // hits this hardest). A same-day attempt to patch around it with
      // a pure-CSS media-query fallback (mirroring the reading
      // column's own min(800px, calc(100vw - 28px)) grid formula)
      // turned out to have its own bug: raw 100vw includes the
      // vertical scrollbar's own width in some browsers/conditions,
      // which this file's OWN --book-viewport-width comment already
      // documented as a ~15-17px trap elsewhere — reproduced live,
      // confirmed as a real mismatch between the CSS approximation and
      // the grid's own true rendered width, not just a headless-
      // testing artifact. Actually measuring the real DOM (below) via
      // getBoundingClientRect is immune to that same trap — it reports
      // genuine on-screen pixels, scrollbar included, the same way it
      // already does correctly at ≥1200px — so removing this early
      // return in favor of just letting the real measurement run at
      // every width is more robust than re-deriving the same number
      // twice in two different ways that can silently disagree. */
      var mainContent = document.getElementById('quarto-document-content');
      if (!mainContent) return;
      // Measure #title-block-header (the chapter title/breadcrumb
      // block), not #quarto-document-content itself, when the page has
      // one. Any chapter with a margin note anywhere in its body gets
      // .page-columns.page-full stamped onto #quarto-document-content
      // by Quarto's own build step (required so the nested .column-
      // margin element can resolve its own grid-column against the
      // outer grid at all — see the matching note in styles/
      // custom.css) — which makes it a grid container spanning the
      // FULL page width by design, so its own bounding rect stopped
      // being a valid stand-in for "where the reading column visually
      // is" the moment this book got its first real margin note.
      // #title-block-header is a direct child that's never itself an
      // ancestor of a margin note (titles render before any body
      // content), so Quarto's own default rule for grid children
      // (.page-columns > * { grid-column: body-content-start / body-
      // content-end }) still constrains it correctly regardless of
      // whether its parent has page-full. Falls back to the old
      // measurement on any page without a title block (short chrome
      // pages) — safe there too, since a page with no title also has
      // no way to have picked up page-full in the first place.
      //
      // titleBlockRect.width > 0, not just titleBlock existing: the
      // node can be present in the DOM but display: none (confirmed
      // live on the style-preview page — #title-block-header exists
      // but has no visible title there), which measures as a
      // degenerate (0,0,0,0) rect. A bare `titleBlock ||` truthiness
      // check never falls through in that case (the DOM node itself
      // is still truthy), silently feeding that zeroed rect into the
      // sidebar-position formula below — confirmed live as the actual
      // cause of the right rail landing pinned near the left edge
      // instead of its own column.
      //
      // Second fallback, not just mainContent directly: once a page
      // has NO visible title block AND has its own margin note (style-
      // preview, confirmed live, is the only page that's ever been
      // both at once), mainContent itself is ALSO page-full by then —
      // both layers of the original fallback fail together, and the
      // whole navbar/sidebar position formula collapses (confirmed
      // live: left rail and every navbar chrome element vanished).
      // Walk mainContent's own direct children for the first one that
      // actually has visible width — Quarto's own default grid-child
      // rule (.page-columns > * { grid-column: body-content-start /
      // body-content-end }) still constrains any child that ISN'T
      // itself an ancestor of a .column-margin element, and on any
      // real page that's true of everything before the first margin
      // note (title emulation, intro prose, earlier sections) even if
      // a later section further down does contain one.
      var titleBlock = document.getElementById('title-block-header');
      var titleBlockRect = titleBlock ? titleBlock.getBoundingClientRect() : null;
      var contentRect = null;
      var isPageFull = mainContent.classList.contains('page-full');
      // Both the title-block-header measurement AND the children-walk
      // fallback exist ONLY to work around .page-full's own full-viewport-
      // width rect (see the comment above) — neither is a valid stand-in
      // for the reading column on an ordinary, non-page-full page, where
      // mainContent's own rect is already exactly right. This used to be
      // un-gated: title-block-header fired whenever it existed with any
      // nonzero width, page-full or not — confirmed live as the source of
      // a real overlap bug distinct from (but with the identical 648px/
      // 87px signature as) the children-walk one described below: a
      // chapter's own <h1> title block sizes to its OWN text ("Groundwork"
      // renders at 648px), not to its full 800px grid track, on any
      // non-page-full page, which fed that narrower, mis-offset box
      // straight into the sidebar-position formula. Gating this branch on
      // isPageFull too — matching the children-walk fallback's own gate
      // just below — closes it the same way.
      if (isPageFull) {
        if (titleBlockRect && titleBlockRect.width > 0) {
          contentRect = titleBlockRect;
        } else {
          // The children-walk below only exists to work around .page-full
          // itself (mainContent's own rect spans the full viewport width
          // by design once it has one — see the comment above), so it's
          // gated to that case specifically now. Confirmed live it was
          // firing unconditionally instead — on any title-less, NON-
          // page-full page (the home page, which uses this same custom
          // title-emulation treatment as style-preview but has no margin
          // note anywhere in it), mainContent's own rect is ALREADY the
          // correct, narrow 800px reading column; walking its children
          // instead measured .home-title-text-emulation, a normal-flow
          // child sitting INSIDE that box's own 86px padding — 648px
          // wide, inset 87px from the box's true left edge, not a stand-
          // in for the reading column at all. That fed the sidebar-
          // position formula below a column ~174px too narrow and offset
          // ~87px inward, which is exactly the width Page Contents and
          // Table of Contents were confirmed live to overlap the reading
          // column by (77px after each side's own +10px gap).
          for (var ci = 0; ci < mainContent.children.length; ci++) {
            var childRect = mainContent.children[ci].getBoundingClientRect();
            if (childRect.width > 0) { contentRect = childRect; break; }
          }
          if (!contentRect) contentRect = mainContent.getBoundingClientRect();
        }
      } else {
        contentRect = mainContent.getBoundingClientRect();
      }
      if (isPageFull) {
        // Whatever supplied contentRect above on a page-full page —
        // #title-block-header (a direct child too, on any real chapter)
        // just as much as the children-walk fallback — is now itself
        // constrained to the 650px reading-content width (styles/
        // custom.css's own #quarto-document-content.page-full > * rule,
        // the "real 650px box" fix, added after both of those branches
        // were first written) — inset 75px from the TRUE 800px reading
        // column on each side, not flush with it the way it used to be
        // when this code was written against un-constrained 800px
        // children. Confirmed live: left the reading-column background
        // pseudo (styles/custom.css, which reads these same two
        // variables directly) rendering only 650px wide instead of 800,
        // and reintroduced the sidebar-overlap bug on page-full pages
        // specifically. 75/150 are the exact same constants that CSS
        // rule already hardcodes (800px outer − 650px inner = 150px
        // total inset, 75px each side) — recovering the true outer box
        // from the inset one this function is able to measure, not a
        // new, independent number.
        contentRect = { left: contentRect.left - 75, width: contentRect.width + 150 };
      }
      document.documentElement.style.setProperty('--book-navbar-bar-left', contentRect.left + 'px');
      document.documentElement.style.setProperty('--book-navbar-bar-width', contentRect.width + 'px');
      // --book-viewport-width: styles/custom.css §23 uses this to
      // anchor #quarto-sidebar's own right edge (the one facing the
      // reading column) via the CSS right property instead of left
      // — a reader dragging the window narrower live saw the left
      // rail briefly overlap the reading column and produce a
      // stray horizontal scrollbar, self-correcting once the drag
      // stopped. Root cause: the old left: calc(...) formula mixed
      // this JS-measured contentRect.left (only refreshed once per
      // resize event, which can lag a frame behind a fast
      // continuous drag) with --book-sidebar-w-extended (a pure
      // CSS clamp(), which recomputes instantly on every native
      // reflow, no JS involved) — during a fast drag those two
      // could transiently disagree, throwing the computed left
      // off by the same amount. The right rail never had this bug
      // because both of ITS inputs (--book-navbar-bar-left and
      // -width) come from this same measurement pass, always in
      // sync with each other. Using right instead of left lets
      // the browser resolve the left rail's own actual left edge
      // from (this single JS anchor) minus (the live CSS width)
      // natively, in the same synchronous layout pass as the
      // width itself — eliminating the two-source mix entirely.
      // clientWidth, not 100vw: 100vw can include the vertical
      // scrollbar's own width in some browsers, which would throw
      // this off by a consistent ~15–17px on a page tall enough to
      // scroll (confirmed this book's own pages always are) —
      // clientWidth already excludes it, matching the same
      // viewport-relative coordinate space getBoundingClientRect()
      // above uses.
      document.documentElement.style.setProperty('--book-viewport-width', document.documentElement.clientWidth + 'px');
    };

    // Hides the lowest-priority nav items one at a time if the row
    // is wider than the bar itself is allowed to be (the reading
    // column's own width, same bound setBarBounds just measured) —
    // same "squeeze in" behavior this had before, just measured
    // against the bar's own width instead of the old brand/tools
    // gap now that neither of those shares this row anymore.
    var updateNavPriorityCollapse = function () {
      if (getComputedStyle(navToggler).display !== 'none') return;
      var items = Array.prototype.map.call(navLinksRow.children, function (li) {
        var label = li.querySelector('.menu-text');
        var text = label ? label.textContent.replace(/[’]/g, "'").trim() : '';
        return { li: li, text: text };
      });
      items.forEach(function (item) { item.li.style.display = ''; });
      var PRIORITY = ["Author's Notes", 'Support', 'Contact', 'Appendices', 'Resources', 'References'];
      var SAFETY_MARGIN = 24;
      var navbarRect = navbarEl.getBoundingClientRect();
      // Left edge of the actually-available room for nav items: the
      // navbar's own left edge, UNLESS .book-mobile-brand (the title,
      // shown below ~1200px) reaches further right than that, in which
      // case its own right edge is what really bounds the row — measured
      // directly and unconditionally, not estimated from which named
      // width-regime is presumed active. A previous version gated this
      // correction behind html.book-compact-mode/.book-study-mode (the
      // JS's own single 1338px threshold) on the theory that the title
      // only ever overlaps in that state — confirmed live that this
      // missed a SEPARATE, independent CSS breakpoint at 1120px
      // (styles/custom.css's own 800–1119.98px vs 1120–1337.98px split
      // for this same title/navbar geometry) that changes the title's
      // real rendered position without changing which named regime the
      // JS thought it was in: the two systems don't share one boundary,
      // so a check keyed to only one of them was correct on one side of
      // 1120px and wrong on the other — items got hidden going into that
      // range, then measured as fitting again once inside it, and
      // reappeared. Comparing brandRect.right against navbarRect.left
      // directly, every single time, is correct regardless of which CSS
      // breakpoint produced the current geometry — there's no regime to
      // guess at. (getBoundingClientRect() on a display:none element
      // reports 0/0/0/0, so the "> navbarRect.left" comparison below
      // naturally no-ops instead of needing its own separate display
      // check.)
      var leftEdge = navbarRect.left;
      var brandEl = document.querySelector('.book-mobile-brand');
      if (brandEl) {
        var brandRect = brandEl.getBoundingClientRect();
        if (brandRect.right > leftEdge) leftEdge = brandRect.right;
      }
      var barWidth = navbarRect.right - leftEdge;
      var fits = function () {
        return barWidth - navLinksRow.scrollWidth >= SAFETY_MARGIN;
      };
      for (var p = 0; p < PRIORITY.length && !fits(); p++) {
        for (var i = 0; i < items.length; i++) {
          if (items[i].text === PRIORITY[p]) {
            items[i].li.style.display = 'none';
            break;
          }
        }
      }
    };

    // Compact mode: pure width check, no localStorage — the pre-paint
    // sentinel in book-head-includes.html sets this same class
    // synchronously on load so there's no flash, but only a resize
    // listener can keep it correct afterward (a browser resize doesn't
    // re-run <head> scripts). Independent of Study mode's own class
    // (book-study-mode) — styles/custom.css keys the shared off-canvas
    // behavior off "html.book-compact-mode, html.book-study-mode" and
    // keys navbar-dimming off html.book-study-mode alone, so setting
    // this class here never touches dimming. 1338px is the Full-stage
    // floor (255+14+800+14+255, both rails at full docked width) — this
    // class covers all of Compact (both the wide/centered and narrow/
    // flush-left sub-phases, a pure-CSS split with no JS state of its
    // own) plus Mobile below that.
    var updateCompactModeClass = function () {
      document.documentElement.classList.toggle('book-compact-mode', window.innerWidth < 1338);
    };

    var updateFloatingNav = function () {
      setBarBounds();
      // updateCompactModeClass() BEFORE updateNavPriorityCollapse():
      // the priority-collapse calculation reads html.book-compact-mode
      // (the isCrunched branch, above) to decide whether to subtract
      // the title's own occupied width from the available bar width.
      // Called in the other order, every resize event read LAST tick's
      // class value, not the current width's — one full event behind,
      // self-correcting only on the NEXT resize. Confirmed live as the
      // actual cause of nav items hiding then reappearing while
      // dragging the window narrower across the 1338px boundary: for
      // exactly one resize tick, isCrunched still reflected the
      // pre-crossing state, so the title-overlap correction either
      // fired a tick too early or too late relative to the real width.
      updateCompactModeClass();
      updateNavPriorityCollapse();
    };
    updateFloatingNav();
    window.addEventListener('resize', updateFloatingNav);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(updateFloatingNav);
    }
  })();

  // Hide-on-scroll-down/show-on-scroll-up for the running head + its
  // two floating icons: a small hand-rolled tracker, NOT a reuse of
  // Quarto's own bundled headroom.js (site_libs/quarto-nav/
  // headroom.min.js + quarto-nav.js, which drives #quarto-header's own
  // .headroom--pinned/-unpinned classes). An earlier version of this
  // read those same classes via a CSS sibling selector instead of
  // running its own tracker — reverted on request: opening the ToC
  // popup (the left floating icon's own click, above) and then
  // scrolling or clicking away left the bar/icons permanently stuck in
  // whichever state they were in at that moment, alternating between
  // "stuck open" and "stuck collapsed" depending on how many times the
  // popup had been opened — confirmed live as a real, reproducible
  // regression, though its exact mechanism inside Quarto's own bundled
  // headroom instance was never pinned down (no live browser access to
  // inspect #quarto-header's actual className during the stuck state).
  // Tracking scroll position independently, with no dependency on
  // #quarto-header's own classes or Bootstrap's Collapse plugin
  // (either of which the popup's own open/close code does touch),
  // makes this robust regardless of what that coupling actually was.
  (function () {
    var lastY = window.pageYOffset || document.documentElement.scrollTop;
    var tolerance = 5; // matches quarto-nav.js's own headroom tolerance
    var ticking = false;
    // #quarto-header itself (quarto-nav.js's real headroom instance —
    // confirmed live, styles/custom.css §19, to toggle
    // .headroom--pinned/--unpinned on every scroll reliably).
    // Used below only as an end-of-frame correction, not as this
    // tracker's primary signal — a straight CSS-sibling-selector read
    // of these same classes was tried once already and reverted (see
    // comment above this IIFE) because it got stuck mid-toggle when
    // the ToC popup's own open/close code touched a sibling class.
    // Re-reading it here, every rAF frame, as a correction applied
    // AFTER the delta logic below rather than replacing it, closes a
    // real desync instead: this tracker and quarto-nav.js's own are
    // two independent scroll listeners with their own timing, and on
    // a real phone (momentum scroll, rubber-banding, the address bar
    // collapsing mid-scroll) they could fall out of step for a beat —
    // long enough for the real header to already be back at full
    // height while #quarto-sidebar's CSS (styles/custom.css, the
    // --book-mobile-chrome-height fix) still thought it only needed
    // to clear the shorter unpinned height, clipping the drawer's own
    // top rows behind the reappeared header. Confirmed as the cause
    // of a reader's screenshot showing "P. Preface" clipped at the
    // drawer's top after scrolling up.
    var headerEl = document.getElementById('quarto-header');
    // book-scrolled: a second, unrelated piece of state this same
    // tracker happens to be well-placed for — the running head's own
    // content/border should stay hidden ("just the icon itself") only
    // for as long as the reader is still sitting at the very top of
    // the page, where the chapter title on the page itself is already
    // doing this bar's job. An absolute-position check (currentY <=
    // tolerance), not a direction/delta one like book-chrome-unpinned
    // above — this needs to come back off if the reader scrolls back
    // up to the true top, not just track "has this pageview ever
    // scrolled once."
    var update = function () {
      var currentY = window.pageYOffset || document.documentElement.scrollTop;
      var navH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--book-navbar-height')) || 52;
      if (currentY <= navH) {
        document.documentElement.classList.remove('book-chrome-unpinned');
      } else if (currentY > lastY + tolerance) {
        document.documentElement.classList.add('book-chrome-unpinned');
      } else if (currentY < lastY - tolerance) {
        document.documentElement.classList.remove('book-chrome-unpinned');
      }
      if (headerEl) {
        if (headerEl.classList.contains('headroom--unpinned')) {
          document.documentElement.classList.add('book-chrome-unpinned');
        } else if (headerEl.classList.contains('headroom--pinned')) {
          document.documentElement.classList.remove('book-chrome-unpinned');
        }
      }
      document.documentElement.classList.toggle('book-scrolled', currentY > tolerance);
      lastY = currentY;
      ticking = false;
    };
    // Run once immediately, not just on the first scroll event — a
    // reader landing already scrolled down (an anchor link, or a
    // restored history/bfcache scroll position) needs book-scrolled
    // set correctly from the first paint, not stuck hidden until they
    // scroll again.
    update();
    window.addEventListener('scroll', function () {
      if (ticking) return;
      ticking = true;
      window.requestAnimationFrame(update);
    }, { passive: true });
  })();

  // ── Mobile chrome height, measured not guessed ────────────────────
  // Below 800px, the sidebar drawers/nav-collapse (styles/custom.css
  // §21) need to start clear of the fixed header + secondary nav
  // stacked above them, or their own top content paints underneath
  // .quarto-secondary-nav's higher z-index (confirmed live — a
  // reader's actual bug report, not theoretical). That combined
  // height was first hardcoded as a single 99px magic number
  // (47px header + 52px secondary nav, both measured once) — and
  // then immediately went stale the same day: adding
  // .book-mobile-brand (the title clone) above grew the header
  // itself to ~62px, so every one of those hardcoded 99pxs was
  // quietly ~15px short everywhere, not just on the one page it was
  // first noticed on. Measuring the real, current bottom edge of
  // whichever of the two bars is actually the taller one — the
  // secondary nav is normally last and tallest, but don't assume —
  // and exposing it as a CSS variable is what stops this from
  // going stale again the next time either bar's own height
  // changes for any reason.
  (function () {
    var setMobileChromeHeight = function () {
      if (window.innerWidth >= 992) return;
      var header = document.getElementById('quarto-header');
      var secondaryNav = document.querySelector('.quarto-secondary-nav');
      var headerBottom = header ? header.getBoundingClientRect().bottom : 0;
      var bottom = headerBottom;
      var secondaryNavHeight = 0;
      if (secondaryNav && getComputedStyle(secondaryNav).display !== 'none') {
        var secondaryNavRect = secondaryNav.getBoundingClientRect();
        bottom = Math.max(bottom, secondaryNavRect.bottom);
        secondaryNavHeight = secondaryNavRect.height;
      }
      if (bottom > 0) {
        // Absolute viewport offset — for position: fixed elements
        // (the two sidebar drawers) that need a real top value.
        document.documentElement.style.setProperty('--book-mobile-chrome-height', bottom + 'px');
      }
      // Just the secondary nav's own height, separately — for
      // .navbar-collapse, a normal-flow (not fixed) element that
      // already starts right after the header within the same
      // growing .navbar box, so it only ever needs a margin
      // clearing the secondary nav specifically, not the header's
      // own height too (that part it already clears on its own).
      document.documentElement.style.setProperty('--book-mobile-secondary-nav-height', secondaryNavHeight + 'px');
    };
    setMobileChromeHeight();
    window.addEventListener('resize', setMobileChromeHeight);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(setMobileChromeHeight);
    }
  })();

  // ── Close open dropdowns on scroll ────────────────────────────────
  // A reader kept finding a Font/Layout/Palette/Appendices/etc. menu
  // still open and floating over the page after they'd already
  // started reading again — it only closes today on an outside
  // click/Escape/re-toggle, not on scroll. Every one of these is a
  // real Bootstrap dropdown (data-bs-toggle="dropdown"), so this
  // just asks each currently-open one to hide itself via Bootstrap's
  // own API rather than reimplementing open/close state here.
  // window's own scroll event (not a listener on the dropdown menu
  // itself) is what makes this only fire for the *page* scrolling —
  // scrolling inside a long open menu (.book-settings-menu's own
  // max-height/overflow-y: auto, e.g. the Font list) never bubbles
  // a scroll event up to window, so that still works normally
  // without closing the very menu being scrolled. passive: true
  // since nothing here ever calls preventDefault.
  (function () {
    var closeOpenDropdowns = function () {
      if (!window.bootstrap || !window.bootstrap.Dropdown) return;
      // Not scoped to .navbar alone: the Font/Layout/Palette settings
      // dropdown this was written for (comment above) actually lives
      // inside #quarto-margin-sidebar (rescueMarginSidebar, above,
      // reparents it under #quarto-content) — outside .navbar entirely —
      // so a .navbar-scoped selector only ever caught the real top-nav
      // dropdowns (Appendices/References/Resources) and silently missed
      // the menus the comment explicitly names. Every .dropdown-toggle.show
      // in the document is a real Bootstrap dropdown currently floating
      // open over the page, which is exactly what should close on scroll.
      var openToggles = document.querySelectorAll('.dropdown-toggle.show');
      openToggles.forEach(function (toggle) {
        var instance = window.bootstrap.Dropdown.getInstance(toggle);
        if (instance) instance.hide();
      });
    };
    window.addEventListener('scroll', closeOpenDropdowns, { passive: true });
  })();

  // ── Mobile: running "where you are" indicator ────────────────────
  // .quarto-secondary-nav (the second header bar) is already
  // mobile-only — hidden outright at min-width:800px (moved there
  // from Bootstrap's native 992px by styles/custom.css §21), so
  // nothing here needs its own media query.
  // Bootstrap's scrollspy already tracks which section is in view
  // for the desktop "Page Contents" TOC (it stamps .active onto
  // that section's nav#TOC link) — reuse that same signal instead
  // of re-detecting scroll position ourselves. Mirrors a printed
  // book's running head: as you scroll, this shows exactly which
  // subsection you're in (e.g. "2.3 Necessary Possibility of
  // Change"), not just which chapter the page belongs to.
  var secondaryBreadcrumbs = document.querySelector('.quarto-secondary-nav .quarto-page-breadcrumbs');
  if (secondaryBreadcrumbs) {
    var sectionIndicator = document.createElement('span');
    sectionIndicator.className = 'mobile-current-section';
    secondaryBreadcrumbs.parentNode.insertBefore(sectionIndicator, secondaryBreadcrumbs.nextSibling);
    // Second target for the same text — the Compact-mode/gap running
    // head built alongside the floating icons, above. Queried rather
    // than closed over since it's built in an earlier, separate IIFE;
    // always exists by the time this runs (unconditional there), so
    // no null guard needed beyond the textContent assignments below
    // tolerating a null element the same way they'd tolerate any DOM
    // node.
    var runningHeadEl = document.querySelector('.book-running-head');

    // Don't trust Bootstrap scrollspy's .active class at all here —
    // in practice it was marking the first TOC entry (e.g. "4.1")
    // active immediately on page load, before the reader had
    // actually scrolled anywhere near it. Instead, track each TOC
    // entry's own heading position directly and work out "current
    // section" ourselves: the last heading that's scrolled up past
    // the header, in document order. If none have yet (still above
    // the chapter's first ## heading), that's the chapter's own
    // root content, so fall back to its number+title from the left
    // sidebar's active entry.
    var tocEntries = Array.prototype.map.call(
      document.querySelectorAll('nav#TOC a.nav-link'),
      function (link) {
        var href = link.getAttribute('href');
        var heading = null;
        // These hrefs now render as full absolute URLs (e.g.
        // "http://…/groundwork.html#sec-1-1"), not bare fragments
        // — document.querySelector() rejects that outright as an
        // invalid selector (it's not looking for a URL, just a
        // selector string), throwing on literally every entry.
        // The try/catch below swallowed that silently, so
        // tocEntries came out empty and this whole feature quietly
        // fell back to its "still above the first heading" branch
        // on every scroll, forever — reads as "stuck on the
        // chapter title," not as broken. Only the fragment
        // (#sec-1-1 onward) is ever a valid selector regardless of
        // whether the href is absolute or already bare.
        if (href && href.indexOf('#') !== -1) {
          href = href.slice(href.indexOf('#'));
        }
        // A malformed href (rare, but not impossible across every
        // heading in the book) throws a DOMException from
        // querySelector rather than just returning null — and an
        // uncaught exception here would abort not just this entry
        // but every remaining line in this DOMContentLoaded
        // handler, including the unrelated right-sidebar toggle
        // button created further down. That's what actually
        // happened: one bad selector silently took out both.
        if (href) {
          try { heading = document.querySelector(href); } catch (e) {}
        }
        return heading ? { link: link, heading: heading } : null;
      }
    ).filter(Boolean);
    var headerOffsetPx = function () {
      var styles = getComputedStyle(document.documentElement);
      var navH = parseFloat(styles.getPropertyValue('--book-navbar-height')) || 52;
      var secH = parseFloat(styles.getPropertyValue('--book-secondary-nav-height')) || 44;
      return navH + secH;
    };

    // "1. Groundwork" — the chapter's own number+title, read off the
    // left sidebar's active entry. Used both as the fallback text
    // before a reader has scrolled past the chapter's first ##
    // heading, and as the leading crumb of the breadcrumb trail below
    // once they have — on request: "it also says, like, one
    // Groundwork, one point one Reality," not just the deepest
    // heading alone.
    var getChapterCrumb = function () {
      var chapterLink = document.querySelector(
        '#quarto-sidebar .sidebar-link.active, #quarto-sidebar .sidebar-item-text.active'
      );
      // sidebar-chapter-numbers.js already split this link's text into
      // separate .sidebar-chapter-num / -title-text spans with no
      // space between them in the DOM (a dotted leader sits between
      // them visually instead) — chapterLink.textContent would
      // concatenate them straight into "1.Groundwork" with no space.
      // Read the two spans back out and join with one.
      var chNum = chapterLink ? chapterLink.querySelector('.sidebar-chapter-num') : null;
      var chTitle = chapterLink ? chapterLink.querySelector('.sidebar-chapter-title-text') : null;
      return chNum && chTitle
        ? chNum.textContent + ' ' + chTitle.textContent
        : (chapterLink ? chapterLink.textContent.trim() : '');
    };

    // Just the current section itself ("1.1.1 Reality Precludes"), not
    // the full ancestor trail — reverted on request: the chain version
    // ("1. Groundwork › 1.1 Reality › 1.1.1 Reality Precludes") read as
    // too long/busy for the mobile bar it lives in. Falls back to the
    // chapter's own crumb (getChapterCrumb, above) only while still
    // above the chapter's first ## heading, where there's no section
    // yet to name.
    var updateCurrentSection = function () {
      var offset = headerOffsetPx();
      var current = null;
      for (var i = 0; i < tocEntries.length; i++) {
        if (tocEntries[i].heading.getBoundingClientRect().top <= offset) {
          current = tocEntries[i].link;
        } else {
          break; // headings are in document order — first one still below stops the search
        }
      }
      var num = current ? current.querySelector('.toc-entry-num') : null;
      var title = current ? current.querySelector('.toc-entry-title') : null;
